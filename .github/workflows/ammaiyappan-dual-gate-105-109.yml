name: Ammayappan dual-gate PDF 105-109

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ammaiyappan-dual-gate-105-109.yml"
      - "works/ammaiyappan/scripts/apply_dual_gate_sync_105_109.py"
      - "works/ammaiyappan/notes/dual-gate-sync-pdf-105-109.json"

permissions:
  contents: write

jobs:
  verify-and-synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply locked PDF 105-109 dual-gate corrections
        run: python works/ammaiyappan/scripts/apply_dual_gate_sync_105_109.py
      - name: Verify change scope
        shell: bash
        run: |
          git status --short
          python - <<'PY'
          import subprocess
          allowed={
            'works/ammaiyappan/transcription/full-text.md',
            'works/ammaiyappan/transcription/parts/pdf-105-109.md',
            'works/ammaiyappan/notes/textual-notes-pdf-105-109.md',
            'works/ammaiyappan/notes/dual-gate-sync-report-pdf-105-109.json',
          }
          changed={line[3:] for line in subprocess.check_output(['git','status','--short'],text=True).splitlines() if line.strip()}
          if changed-allowed: raise SystemExit(f'unexpected changed paths: {sorted(changed-allowed)}')
          if allowed-changed: raise SystemExit(f'expected changed paths missing: {sorted(allowed-changed)}')
          PY
      - name: Commit verified PDF 105-109 batch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            works/ammaiyappan/transcription/full-text.md \
            works/ammaiyappan/transcription/parts/pdf-105-109.md \
            works/ammaiyappan/notes/textual-notes-pdf-105-109.md \
            works/ammaiyappan/notes/dual-gate-sync-report-pdf-105-109.json
          git commit -m "Verify Ammayappan PDF 105-109 dual gate [skip ci]"
          git push origin HEAD:main
