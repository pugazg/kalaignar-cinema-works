name: Repair and build Vandikkaran Magan English scenes 41-60 once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/vm-translation-batch-041-060-repair-once.yml']
permissions:
  contents: write
jobs:
  repair-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair scene 54 and 55 non-dialogue segmentation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('works/vandikkaran-magan/scripts/translation_batch_041_060_data_c.py')
          s=p.read_text(encoding='utf-8')
          old54="""54: [
          {'text':'Entrance to the estate temple.','locator_kind':'location-caption'},
          {'text':'(Vingan, Kannaayiram, the poet and elders of the town arrive at the temple entrance. A guard stands blocking them.)'},
          {'text':'(Vingan pushes the guard.)'},
          {'text':'(Vingan lifts and throws aside the guard who blocks him. Vingan, the others, Kannaayiram and the poet pound on the door and ram it hard. The door opens. Everyone enters.)'}
          ],"""
          new54="""54: [
          {'text':'Entrance to the estate temple.','locator_kind':'location-caption'},
          {'text':'(Vingan, Kannaayiram, the poet and the town elders run up... Sadaiyan follows a little behind them... Vingan comes near the door.)'},
          {'text':'(The guard extends a spear-like implement in his hand across the way.)'},
          {'text':'(Vingan pushes the guard.)'},
          {'text':'(Vingan lifts and throws aside the guard who blocks him. Vingan, the others, Kannaayiram and the poet pound on the door and ram it hard. The door opens. Everyone enters.)'}
          ],"""
          old55="""55: [
          {'kind':'performance-cue','occurrence_id':'vandikkaran-magan-perf-007','text':'Interior of the temple. (The poet’s daughter Poongodi sits bent forward as a bride; a bridegroom sits beside her. Mantra sound — wedding dais — those who see it stand astonished.)'},
          {'text':'(One by one everyone leaves. Sadaiyan goes with them. The poet and Vingan remain.)'},
          {'text':'(Vingan leaves quickly.)'},
          {'text':'(After he leaves, the door is closed.)'},
          {'text':'(The poet goes and touches her—the corpse of Poongodi falls down without the bowed head rising.)'},
          {'kind':'source-unlabelled','text':'(Looking at the zamindar) You sinner! Did you kill her?...'},
          {'text':'(He takes the standing lamp and is about to stab the zamindar with it. The man who had been dressed as an Iyer removes and throws away the sacred thread and headpiece, then stabs the poet in the stomach with a knife. The poet cries out and collapses.)'}
          ]"""
          new55="""55: [
          {'text':'Interior of the temple.','locator_kind':'location-caption'},
          {'kind':'performance-cue','occurrence_id':'vandikkaran-magan-perf-007','text':'(The poet’s daughter Poongodi sits bent forward as a bride; a bridegroom sits beside her. Mantra sound — wedding dais — those who see it stand astonished.)'},
          {'text':'(One by one everyone leaves. Sadaiyan goes with them. The poet and Vingan remain.)'},
          {'text':'(Vingan leaves quickly.)'},
          {'text':'(After he leaves, the door is closed.)'},
          {'text':'(The poet goes and touches her—the corpse of Poongodi falls down without the bowed head rising.)'},
          {'kind':'source-unlabelled','text':'(Looking at the zamindar) You sinner! Did you kill her?...'},
          {'text':'(He takes the standing lamp and is about to stab the zamindar with it. The man who had been dressed as an Iyer removes and throws away the sacred thread and headpiece, then stabs the poet in the stomach with a knife. The poet cries out and collapses.)'}
          ]"""
          assert old54 in s, 'expected scene-54 ND block not found'
          assert old55 in s, 'expected scene-55 ND block not found'
          s=s.replace(old54,new54,1).replace(old55,new55,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Build and verify English scenes 41-60
        run: |
          python works/vandikkaran-magan/scripts/build_translation_batch_041_060.py
      - name: Verify generated JSON parses
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          W=Path('works/vandikkaran-magan')
          idx=json.loads((W/'translations'/'index.json').read_text(encoding='utf-8'))
          qa=json.loads((W/'translations'/'batch-041-060-qa.json').read_text(encoding='utf-8'))
          assert qa['status']=='PASS'
          assert qa['verified_scenes']==20
          assert qa['immutable_dialogue_records_expected']==156
          assert qa['immutable_dialogue_records_linked']==156
          assert qa['inferred_speaker_assignments']==0
          assert idx['verified_scenes']==60
          for n in range(41,61):
              obj=json.loads((W/'translations'/'records'/f'scene-{n:03d}.json').read_text(encoding='utf-8'))
              assert obj['scene_status']=='verified' and obj['scene_ordinal']==n
          print('scene-041-060-pass')
          PY
      - name: Commit verified batch
        run: |
          rm -f .github/workflows/vm-translation-batch-041-060-repair-once.yml
          rm -f .github/workflows/vm-translation-batch-041-060-once.yml
          rm -f .github/data/vm_translation_sourcepack_041_060.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Build Vandikkaran Magan English scenes 41-60 [skip ci]'
          git push origin main
# retry after source-faithful scene-54/55 segmentation repair
