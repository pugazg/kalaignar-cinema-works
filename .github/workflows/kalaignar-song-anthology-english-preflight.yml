name: Kalaignar song anthology English reader QA and Reading Room payload

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "works/kalaignar-thirai-isai-paadalgal/translations/index.json"
      - "works/kalaignar-thirai-isai-paadalgal/translations/records/**"
      - "works/kalaignar-thirai-isai-paadalgal/songs/index.json"
      - "works/kalaignar-thirai-isai-paadalgal/songs/page-map.json"
      - "works/kalaignar-thirai-isai-paadalgal/songs/song-*.md"
      - "works/kalaignar-thirai-isai-paadalgal/editions/en/audit_probe.py"
      - "works/kalaignar-thirai-isai-paadalgal/editions/en/write_preflight_report.py"
      - "works/kalaignar-thirai-isai-paadalgal/editions/en/build.py"
      - "works/kalaignar-thirai-isai-paadalgal/editions/en/sync_reader_status.py"
      - "works/kalaignar-thirai-isai-paadalgal/integrations/reading-room/build.py"
      - "works/kalaignar-thirai-isai-paadalgal/integrations/reading-room/sync_status.py"
      - ".github/workflows/kalaignar-song-anthology-english-preflight.yml"

permissions:
  contents: write

jobs:
  reader-qa-and-reading-room-payload:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run whole-corpus English reader preflight
        run: python works/kalaignar-thirai-isai-paadalgal/editions/en/audit_probe.py

      - name: Write passing preflight report
        run: python works/kalaignar-thirai-isai-paadalgal/editions/en/write_preflight_report.py

      - name: Build and validate deterministic English reader exports
        run: python works/kalaignar-thirai-isai-paadalgal/editions/en/build.py

      - name: Synchronize completed reader/export status
        run: python works/kalaignar-thirai-isai-paadalgal/editions/en/sync_reader_status.py

      - name: Build and validate Reading Room integration payload
        run: python works/kalaignar-thirai-isai-paadalgal/integrations/reading-room/build.py

      - name: Synchronize Reading Room payload status
        run: python works/kalaignar-thirai-isai-paadalgal/integrations/reading-room/sync_status.py

      - name: Commit passing reader and Reading Room payload checkpoints
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            data/works.json \
            docs/STATUS_CONSISTENCY_AUDIT.md \
            works/kalaignar-thirai-isai-paadalgal/README.md \
            works/kalaignar-thirai-isai-paadalgal/metadata.yaml \
            works/kalaignar-thirai-isai-paadalgal/PROGRESS.md \
            works/kalaignar-thirai-isai-paadalgal/AUDIT.md \
            works/kalaignar-thirai-isai-paadalgal/PROJECT_HANDOVER.md \
            works/kalaignar-thirai-isai-paadalgal/songs/README.md \
            works/kalaignar-thirai-isai-paadalgal/translations/index.json \
            works/kalaignar-thirai-isai-paadalgal/translations/README.md \
            works/kalaignar-thirai-isai-paadalgal/editions/en/PREFLIGHT_QA_REPORT.md \
            works/kalaignar-thirai-isai-paadalgal/editions/en/reader-edition.md \
            works/kalaignar-thirai-isai-paadalgal/editions/en/reader-edition.html \
            works/kalaignar-thirai-isai-paadalgal/editions/en/reader-edition.json \
            works/kalaignar-thirai-isai-paadalgal/editions/en/QA_REPORT.md \
            works/kalaignar-thirai-isai-paadalgal/editions/en/manifest.json \
            works/kalaignar-thirai-isai-paadalgal/integrations/reading-room/reading-room.json \
            works/kalaignar-thirai-isai-paadalgal/integrations/reading-room/QA_REPORT.md \
            works/kalaignar-thirai-isai-paadalgal/integrations/reading-room/manifest.json
          if git diff --cached --quiet; then
            echo "Reader package, integration payload and synchronized status are already reproducible; nothing to commit."
          else
            git commit -m "Prepare anthology Reading Room payload [skip ci]"
            git push
          fi
