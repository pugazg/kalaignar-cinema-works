name: Kalaignar song anthology English reader preflight

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "works/kalaignar-thirai-isai-paadalgal/translations/index.json"
      - "works/kalaignar-thirai-isai-paadalgal/translations/records/**"
      - "works/kalaignar-thirai-isai-paadalgal/songs/page-map.json"
      - "works/kalaignar-thirai-isai-paadalgal/songs/song-*.md"
      - "works/kalaignar-thirai-isai-paadalgal/editions/en/audit_probe.py"
      - "works/kalaignar-thirai-isai-paadalgal/editions/en/write_preflight_report.py"
      - "works/kalaignar-thirai-isai-paadalgal/editions/en/sync_preflight_status.py"
      - ".github/workflows/kalaignar-song-anthology-english-preflight.yml"

permissions:
  contents: write

jobs:
  reader-preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run whole-corpus English reader preflight
        run: python works/kalaignar-thirai-isai-paadalgal/editions/en/audit_probe.py

      - name: Write passing preflight report
        run: python works/kalaignar-thirai-isai-paadalgal/editions/en/write_preflight_report.py

      - name: Synchronize repository preflight status
        run: python works/kalaignar-thirai-isai-paadalgal/editions/en/sync_preflight_status.py

      - name: Commit passing preflight checkpoint
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            data/works.json \
            docs/STATUS_CONSISTENCY_AUDIT.md \
            works/kalaignar-thirai-isai-paadalgal/editions/en/PREFLIGHT_QA_REPORT.md
          if git diff --cached --quiet; then
            echo "Preflight report and synchronized status are already current; nothing to commit."
          else
            git commit -m "Record anthology English reader preflight [skip ci]"
            git push
          fi
