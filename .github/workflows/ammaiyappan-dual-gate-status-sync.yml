name: Ammayappan dual-gate status synchronization

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ammaiyappan-dual-gate-status-sync.yml"
      - "works/ammaiyappan/scripts/sync_dual_gate_checkpoint.py"

permissions:
  contents: write

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronize Ammayappan status mirrors
        run: python works/ammaiyappan/scripts/sync_dual_gate_checkpoint.py

      - name: Verify change scope
        shell: bash
        run: |
          git status --short
          python - <<'PY'
          import subprocess
          allowed = {
              'README.md',
              'data/works.json',
              'docs/HANDOVER_KALAIGNAR_CINEMA_WORKS.md',
              'docs/STATUS_CONSISTENCY_AUDIT.md',
              'works/ammaiyappan/notes/historical-glyph-audit.md',
          }
          changed = {
              line[3:] for line in subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
              if line.strip()
          }
          extra = changed - allowed
          if extra:
              raise SystemExit(f'unexpected changed paths: {sorted(extra)}')
          PY

      - name: Commit synchronized mirrors
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/works.json docs/HANDOVER_KALAIGNAR_CINEMA_WORKS.md docs/STATUS_CONSISTENCY_AUDIT.md works/ammaiyappan/notes/historical-glyph-audit.md
          if git diff --cached --quiet; then
            echo "Ammayappan status mirrors already synchronized."
          else
            git commit -m "Synchronize Ammayappan dual-gate checkpoint [skip ci]"
            git push origin HEAD:main
          fi
