name: Vandikkaran Magan dialogue diagnostic once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vandikkaran-magan-dialogue-diagnostic-once.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Review preflight edge cases
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('works/vandikkaran-magan/notes/dialogue-index-preflight.json').read_text(encoding='utf-8'))
          print('COLON_ONLY')
          for sid, rows in p['candidates_by_scene'].items():
              for r in rows:
                  if r['source_delimiter'] == ':':
                      print(sid, r['pdf_page'], repr(r['speaker_label']), repr(r['text_start']))
          print('ANOMALOUS')
          for r in p['anomalous_delimiter_candidates']:
              print(r['scene_id'], r['pdf_page'], repr(r['raw']))
          print('CROSS_PAGE')
          for r in p['cross_page_continuation_candidates']:
              print(r['scene_id'], r['pdf_pages'], repr(r['speaker_label']), repr(r['start_line_text']))
          print('UNLABELLED_BLOCKS', len(p['unlabelled_blocks']))
          for r in p['unlabelled_blocks'][:80]:
              print(r['scene_id'], r['pdf_page'], repr(' / '.join(r['lines'])[:220]))
          PY
