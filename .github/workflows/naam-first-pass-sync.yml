name: Naam Phase 10 bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/naam-first-pass-sync.yml'
      - '.github/scripts/naam_phase10_sync.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Phase 10 entry gate
        run: |
          python - <<'PY'
          import json
          e=json.load(open('works/naam/translations/index.json'))
          q=json.load(open('works/naam/translations/whole-work-reconciliation.json'))
          assert e['status']=='complete-verified'
          assert e['verified_scenes']==45
          assert e['translation_units_verified']==797
          assert e['immutable_dialogue_links_verified']==590
          assert e['retained_performance_records_translated']==7
          assert e['reader_export_status']=='ready-next'
          assert q['status']=='PASS'
          assert q['reader_export_gate']=='READY-NEXT'
          print('Naam Phase 10 entry gate ready.')
          PY
