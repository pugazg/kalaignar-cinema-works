name: Naam verification synchronization

on:
  push:
    branches: [main]
    paths:
      - 'works/naam/**'
      - '.github/workflows/naam-first-pass-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Synchronize PDF 50-54 checkpoint when pending
        run: |
          VERIFIED=$(python -c "import json; print(json.load(open('works/naam/transcription/index.json'))['verified_pages'])")
          if [ "$VERIFIED" = "42" ]; then
            python works/naam/scripts/sync_verification_050_054_core.py
            python works/naam/scripts/sync_verification_050_054_mirrors.py
          else
            echo "PDF 50-54 synchronization already closed or superseded (verified_pages=$VERIFIED)."
          fi

      - name: Validate JSON
        run: |
          python -m json.tool data/works.json >/dev/null
          python -m json.tool works/naam/transcription/index.json >/dev/null

      - name: Commit synchronized mirrors
        run: |
          if git diff --quiet; then
            echo 'No synchronization changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md data/works.json docs/HANDOVER_KALAIGNAR_CINEMA_WORKS.md docs/STATUS_CONSISTENCY_AUDIT.md works/naam
          git commit -m 'Verify Naam PDF 50-54 [skip ci]'
          git push
