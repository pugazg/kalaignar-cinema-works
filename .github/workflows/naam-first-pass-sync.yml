name: Naam character-entity synchronization

on:
  push:
    branches: [main]
    paths:
      - 'works/naam/**'
      - '.github/workflows/naam-first-pass-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate immutable dialogue authority
        run: |
          python - <<'PY'
          import json
          d=json.load(open('works/naam/dialogues/index.json'))
          q=json.load(open('works/naam/notes/dialogue-index-qa.json'))
          assert d['status']=='complete-verified'
          assert d['dialogue_record_count']==590
          assert d['distinct_exact_speaker_labels']==45
          assert q['status']=='PASS'
          assert q['explicit_label_ownership']=='590/590 exactly once'
          assert q['speaker_alias_normalizations']==0
          PY

      - name: Rebuild character-entity preflight
        run: python works/naam/scripts/build_character_preflight.py

      - name: Validate character-entity preflight
        run: |
          python -m json.tool works/naam/characters/labels-preflight.json >/dev/null
          python - <<'PY'
          import json
          p=json.load(open('works/naam/characters/labels-preflight.json'))
          assert p['status']=='review-ready'
          assert p['dialogue_units_scanned']==590
          assert p['distinct_exact_source_labels']==45
          assert len(p['inventory'])==45
          assert sum(x['record_count'] for x in p['inventory'])==590
          assert p['policy']['dialogue_records_modified'] is False
          assert p['policy']['source_speaker_labels_immutable'] is True
          PY

      - name: Build character-entity layer
        run: python works/naam/scripts/build_character_entities.py

      - name: Validate character-entity closure
        run: |
          python -m json.tool works/naam/characters/index.json >/dev/null
          python -m json.tool works/naam/characters/entities.json >/dev/null
          python -m json.tool works/naam/characters/labels-inventory.json >/dev/null
          python -m json.tool works/naam/characters/record-dispositions.json >/dev/null
          python -m json.tool works/naam/characters/schema.json >/dev/null
          python -m json.tool works/naam/notes/character-entity-qa.json >/dev/null
          python -m json.tool data/works.json >/dev/null
          python - <<'PY'
          import json
          i=json.load(open('works/naam/characters/index.json'))
          q=json.load(open('works/naam/notes/character-entity-qa.json'))
          e=json.load(open('works/naam/characters/entities.json'))
          l=json.load(open('works/naam/characters/labels-inventory.json'))
          r=json.load(open('works/naam/characters/record-dispositions.json'))
          assert i['status']=='complete-verified'
          assert i['dialogue_records_source']==590
          assert i['distinct_source_labels']==45
          assert i['entity_count']==28
          assert i['entity_type_counts']=={'character':14,'collective':1,'role':13}
          assert i['label_coverage']=='45/45'
          assert i['dialogue_record_coverage']=='590/590'
          assert i['remaining_unmapped_labels']==0
          assert i['remaining_unmapped_records']==0
          assert i['dialogue_records_modified'] is False
          assert q['status']=='PASS'
          assert q['dialogue_record_coverage']=='590/590 exactly once'
          assert q['source_label_coverage']=='45/45'
          assert len(e)==28
          assert len(l)==45
          assert len(r)==590
          assert len({x['record_id'] for x in r})==590
          assert sum(x['dialogue_record_count'] for x in e)==590
          assert all(x['dialogue_record_modified'] is False for x in r)
          PY

      - name: Commit character-entity closure
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No character-entity changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md data/works.json docs/HANDOVER_KALAIGNAR_CINEMA_WORKS.md docs/STATUS_CONSISTENCY_AUDIT.md works/naam
          git commit -m 'Build Naam character entity index [skip ci]'
          git push
