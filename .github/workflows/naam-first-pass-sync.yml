name: Naam English scenes 2-5 verification

on:
  push:
    branches: [main]
    paths:
      - 'works/naam/**'
      - '.github/scripts/naam_english_batch_002_005.py'
      - '.github/workflows/naam-first-pass-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-batch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Snapshot closed upstream layers
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          roots=['works/naam/transcription','works/naam/scenes','works/naam/dialogues','works/naam/characters','works/naam/songs/records']
          def digest(root):
              h=hashlib.sha256()
              for p in sorted(Path(root).rglob('*')):
                  if p.is_file():
                      h.update(str(p).encode()); h.update(b'\0'); h.update(p.read_bytes()); h.update(b'\0')
              return h.hexdigest()
          Path('/tmp/naam-upstream-before.json').write_text(json.dumps({r:digest(r) for r in roots}),encoding='utf-8')
          PY

      - name: Validate source gates and verified pilot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          t=json.load(open('works/naam/transcription/index.json'))
          s=json.load(open('works/naam/scenes/index.json'))
          d=json.load(open('works/naam/dialogues/index.json'))
          c=json.load(open('works/naam/characters/index.json'))
          p=json.load(open('works/naam/songs/index.json'))
          e=json.load(open('works/naam/translations/index.json'))
          q=json.load(open('works/naam/translations/pilot-qa.json'))
          assert t['status']=='complete-verified' and t['verified_pages']==67
          assert s['status']=='complete-verified' and s['source_scene_count']==45
          assert d['status']=='complete-verified' and d['dialogue_record_count']==590
          assert c['status']=='complete-verified' and c['dialogue_record_coverage']=='590/590'
          assert p['retained_performance_records']==7 and p['source_attributed_authorship_records']==1
          assert p['unresolved_item_level_authorship_records']==6
          assert e['status']=='pilot-verified' and e['verified_scenes']==1 and e['translation_units_verified']==21
          assert e['immutable_dialogue_links_verified']==14 and e['retained_performance_records_translated']==1
          assert q['status']=='PASS' and q['dialogue_coverage']=='14/14 exactly once'
          for n,count in [(2,13),(3,30),(4,29),(5,13)]:
              src=json.load(open(f'works/naam/dialogues/records/scene-{n:03d}.json'))
              assert len(src)==count
              assert Path(f'works/naam/scenes/scene-{n:03d}.md').exists()
          PY

      - name: Build and synchronize scenes 2-5 English batch
        run: python .github/scripts/naam_english_batch_002_005.py

      - name: Validate generated batch and linkage
        run: |
          python -m json.tool works/naam/translations/index.json >/dev/null
          python -m json.tool works/naam/translations/batch-002-005-qa.json >/dev/null
          python -m json.tool data/works.json >/dev/null
          for n in 002 003 004 005; do python -m json.tool works/naam/translations/records/scene-$n.json >/dev/null; done
          python - <<'PY'
          import json
          expected={2:(16,13),3:(46,30),4:(34,29),5:(14,13)}
          total_units=0; total_links=0; unlabelled=0
          for n,(units_expected,dialogs_expected) in expected.items():
              tr=json.load(open(f'works/naam/translations/records/scene-{n:03d}.json'))
              src=json.load(open(f'works/naam/dialogues/records/scene-{n:03d}.json'))
              assert tr['scene_status']=='verified' and tr['source_scene_number']==n
              assert tr['unit_count']==units_expected and len(tr['units'])==units_expected
              ids=[u['id'] for u in tr['units']]
              assert ids==[f'naam-en-s{n:03d}-u{i:03d}' for i in range(1,units_expected+1)]
              assert len(ids)==len(set(ids))
              linked=[u['source']['source_record_id'] for u in tr['units'] if u['source']['source_record_id']]
              assert linked==[r['id'] for r in src] and len(linked)==dialogs_expected
              byid={r['id']:r for r in src}
              for u in tr['units']:
                  assert u['status']=='verified'
                  rid=u['source']['source_record_id']
                  if rid:
                      r=byid[rid]
                      assert u['source']['speaker_label']==r['speaker_label']
                      assert u['source']['source_delimiter']==r['source_delimiter']
                      assert u['source']['page_provenance']==r['page_provenance']
                  assert u['source']['source_occurrence_id'] is None
              unlabelled += sum(1 for u in tr['units'] if u['kind']=='dialogue' and u['source']['source_record_id'] is None)
              total_units += tr['unit_count']; total_links += len(linked)
          assert total_units==110 and total_links==85 and unlabelled==1
          qa=json.load(open('works/naam/translations/batch-002-005-qa.json'))
          assert qa['status']=='PASS' and qa['translation_units']==110
          assert qa['dialogue_coverage']=='85/85 exactly once'
          assert qa['source_unlabelled_speech_units']==1 and qa['inferred_unlabelled_speakers']==0
          assert qa['performance_coverage']=='0/0' and qa['cross_page_translation_units']==[]
          assert qa['authorship_status_changed_by_translation'] is False
          assert qa['external_or_unprinted_lyrics_imported'] is False
          idx=json.load(open('works/naam/translations/index.json'))
          assert idx['status']=='in-progress-verified-through-scene-005'
          assert idx['verified_scenes']==5 and idx['verified_scene_ids']==[f'naam-s{i:03d}' for i in range(1,6)]
          assert idx['translation_units_verified']==131 and idx['immutable_dialogue_links_verified']==99
          assert idx['source_unlabelled_speech_units_verified']==1
          assert idx['retained_performance_records_translated']==1 and idx['song_line_cue_mappings_verified']==23
          assert 'scenes 6–10' in idx['next_activity']
          PY

      - name: Verify upstream layers unchanged
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          roots=['works/naam/transcription','works/naam/scenes','works/naam/dialogues','works/naam/characters','works/naam/songs/records']
          def digest(root):
              h=hashlib.sha256()
              for p in sorted(Path(root).rglob('*')):
                  if p.is_file():
                      h.update(str(p).encode()); h.update(b'\0'); h.update(p.read_bytes()); h.update(b'\0')
              return h.hexdigest()
          before=json.loads(Path('/tmp/naam-upstream-before.json').read_text())
          after={r:digest(r) for r in roots}
          assert before==after,(before,after)
          PY

      - name: Validate synchronized active mirrors
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=Path('works/naam/metadata.yaml').read_text(encoding='utf-8')
          assert 'english_translation: in-progress-verified-5-of-45' in m
          assert 'english_translation_verified_scenes: 5' in m
          assert 'english_translation_unit_count: 131' in m
          assert 'english_dialogue_links_verified: 99' in m
          assert 'english_performance_records_translated: 1' in m
          assert 'english_song_line_cue_mappings_verified: 23' in m
          wr=Path('works/naam/README.md').read_text(encoding='utf-8')
          assert 'English translation: **5/45 VERIFIED' in wr and 'English scenes 2–5 checkpoint' in wr
          root=Path('README.md').read_text(encoding='utf-8')
          assert 'English translation: **5/45 VERIFIED' in root
          nxt=Path('works/naam/NEXT_CHAT_PROMPT.md').read_text(encoding='utf-8')
          assert 'VERIFIED THROUGH SOURCE SCENE 5' in nxt and 'source-numbered scenes 6–10' in nxt
          hand=Path('docs/HANDOVER_KALAIGNAR_CINEMA_WORKS.md').read_text(encoding='utf-8')
          assert 'Naam English scenes 2-5 current' in hand and 'English **5/45 verified' in hand
          audit=Path('docs/STATUS_CONSISTENCY_AUDIT.md').read_text(encoding='utf-8')
          assert 'Naam English scenes 2-5 current' in audit and '5/45 verified / 131 units' in audit
          data=json.load(open('data/works.json')); n=next(x for x in data if x.get('id')=='naam')
          sd=n['structured_derivatives']
          assert sd['english_translation_verified_scenes']==5 and sd['english_translation_units']==131
          assert sd['english_dialogue_links_verified']==99 and sd['english_source_unlabelled_speech_units']==1
          PY

      - name: Commit verified scenes 2-5 batch
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No scenes 2-5 synchronization changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md data/works.json docs/HANDOVER_KALAIGNAR_CINEMA_WORKS.md docs/STATUS_CONSISTENCY_AUDIT.md works/naam
          git commit -m 'Verify Naam English scenes 2-5 [skip ci]'
          git push
