name: Naam verification synchronization

on:
  push:
    branches: [main]
    paths:
      - 'works/naam/**'
      - '.github/workflows/naam-first-pass-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Synchronize source-obscuration hold audit when pending
        run: |
          if [ ! -f works/naam/notes/source-obscuration-hold-resolution.md ]; then
            python works/naam/scripts/sync_hold_resolution.py
          else
            echo "Source-obscuration hold audit already closed or superseded."
          fi

      - name: Validate JSON
        run: |
          python -m json.tool data/works.json >/dev/null
          python -m json.tool works/naam/transcription/index.json >/dev/null

      - name: Commit synchronized mirrors
        run: |
          if git diff --quiet; then
            echo 'No synchronization changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md data/works.json docs/HANDOVER_KALAIGNAR_CINEMA_WORKS.md docs/STATUS_CONSISTENCY_AUDIT.md works/naam
          git commit -m 'Record Naam source-obscuration hold audit [skip ci]'
          git push
