name: Naam song gate reconciliation

on:
  push:
    branches: [main]
    paths:
      - 'works/naam/**'
      - '.github/workflows/naam-first-pass-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate re-audit and new source record
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.load(open('works/naam/notes/song-candidate-recheck.json'))
          assert a['scene_files_scanned']==45
          assert any(r['scene_file']=='scene-001.md' and any(h['text']=='(பாட்டு)' for h in r['hits']) for r in a['rows'])
          assert Path('works/naam/songs/records/naam-perf-007.md').exists()
          s=Path('works/naam/scenes/scene-001.md').read_text(encoding='utf-8')
          assert '(பாட்டு)' in s and '### எல்லோரும்' in s and '### ஆண்' in s and '### பெண்' in s
          PY

      - name: Reconcile song gate
        run: python works/naam/scripts/reconcile_song_gate_scene001.py

      - name: Validate reconciled gate
        run: |
          python -m json.tool works/naam/songs/index.json >/dev/null
          python -m json.tool works/naam/songs/inventory.json >/dev/null
          python -m json.tool works/naam/notes/song-performance-qa.json >/dev/null
          python -m json.tool data/works.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          i=json.load(open('works/naam/songs/index.json'))
          v=json.load(open('works/naam/songs/inventory.json'))
          q=json.load(open('works/naam/notes/song-performance-qa.json'))
          assert i['retained_performance_records']==7
          assert i['unresolved_item_level_authorship_records']==6
          assert i['source_attributed_authorship_records']==1
          assert i['english_translation_gate']=='ready'
          assert v['coverage']=='7/7' and len(v['records'])==7
          assert [x['id'] for x in v['records']][0]=='naam-perf-007'
          assert q['coverage']=='7/7' and q['status']=='PASS'
          assert len(list(Path('works/naam/songs/records').glob('naam-perf-*.md')))==7
          m=Path('works/naam/metadata.yaml').read_text(encoding='utf-8')
          assert 'high_confidence_blocks: 7' in m
          assert 'record_id: "naam-perf-007"' in m
          PY

      - name: Commit reconciliation
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No reconciliation changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md data/works.json docs/HANDOVER_KALAIGNAR_CINEMA_WORKS.md docs/STATUS_CONSISTENCY_AUDIT.md works/naam
          git commit -m 'Reconcile Naam song gate to seven records [skip ci]'
          git push
