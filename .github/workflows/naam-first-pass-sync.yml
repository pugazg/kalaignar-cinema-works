name: Naam song candidate re-audit

on:
  push:
    branches: [main]
    paths:
      - 'works/naam/**'
      - '.github/workflows/naam-first-pass-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate closed source layers
        run: |
          python - <<'PY'
          import json
          d=json.load(open('works/naam/dialogues/index.json'))
          c=json.load(open('works/naam/characters/index.json'))
          assert d['status']=='complete-verified' and d['dialogue_record_count']==590
          assert c['status']=='complete-verified' and c['dialogue_record_coverage']=='590/590'
          PY

      - name: Re-audit song and performance markers
        run: python works/naam/scripts/audit_song_candidates.py

      - name: Validate audit output
        run: |
          python -m json.tool works/naam/notes/song-candidate-recheck.json >/dev/null
          python - <<'PY'
          import json
          a=json.load(open('works/naam/notes/song-candidate-recheck.json'))
          assert a['scene_files_scanned']==45
          assert a['status']=='review-required'
          assert a['scenes_with_marker_hits'] >= 1
          PY

      - name: Commit audit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No audit changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add works/naam/notes/song-candidate-recheck.json works/naam/notes/song-candidate-recheck.md
          git commit -m 'Re-audit Naam song performance candidates [skip ci]'
          git push
