name: Naam English scenes 6-15 verification

on:
  push:
    branches: [main]
    paths:
      - 'works/naam/**'
      - '.github/scripts/naam_english_batch_006_015.py'
      - '.github/scripts/naam_english_batch_006_015_run.py'
      - '.github/workflows/naam-first-pass-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-batch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Snapshot closed upstream layers
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          roots=['works/naam/transcription','works/naam/scenes','works/naam/dialogues','works/naam/characters','works/naam/songs/records']
          def digest(root):
              h=hashlib.sha256()
              for p in sorted(Path(root).rglob('*')):
                  if p.is_file():
                      h.update(str(p).encode()); h.update(b'\0'); h.update(p.read_bytes()); h.update(b'\0')
              return h.hexdigest()
          Path('/tmp/naam-upstream-before.json').write_text(json.dumps({r:digest(r) for r in roots}),encoding='utf-8')
          PY

      - name: Validate source gates and current English checkpoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          assert json.load(open('works/naam/transcription/index.json'))['status']=='complete-verified'
          assert json.load(open('works/naam/scenes/index.json'))['source_scene_count']==45
          d=json.load(open('works/naam/dialogues/index.json')); assert d['dialogue_record_count']==590
          c=json.load(open('works/naam/characters/index.json')); assert c['dialogue_record_coverage']=='590/590'
          p=json.load(open('works/naam/songs/index.json')); assert p['retained_performance_records']==7
          e=json.load(open('works/naam/translations/index.json'))
          assert e['status']=='in-progress-verified-through-scene-005' and e['verified_scenes']==5
          counts={6:16,7:7,8:13,9:20,10:44,11:3,12:5,13:38,14:29,15:5}
          for n,count in counts.items():
              assert len(json.load(open(f'works/naam/dialogues/records/scene-{n:03d}.json')))==count
              assert Path(f'works/naam/scenes/scene-{n:03d}.md').exists()
          inv=json.load(open('works/naam/songs/inventory.json')); byid={x['id']:x for x in inv['records']}
          assert byid['naam-perf-001']['author_as_printed']=='பாரதியார்'
          assert byid['naam-perf-002']['authorship_status']=='unresolved-item-level'
          PY

      - name: Build and synchronize scenes 6-15 English batch
        run: python .github/scripts/naam_english_batch_006_015_run.py

      - name: Validate generated batch and linkage
        run: |
          python -m json.tool works/naam/translations/index.json >/dev/null
          python -m json.tool works/naam/translations/batch-006-015-qa.json >/dev/null
          for n in 006 007 008 009 010 011 012 013 014 015; do python -m json.tool works/naam/translations/records/scene-$n.json >/dev/null; done
          python - <<'PY'
          import json
          expected={6:16,7:7,8:13,9:20,10:44,11:3,12:5,13:38,14:29,15:5}
          total_links=0; total_units=0; unlabelled=[]; occ=[]; maps=0
          for n,count in expected.items():
              tr=json.load(open(f'works/naam/translations/records/scene-{n:03d}.json'))
              src=json.load(open(f'works/naam/dialogues/records/scene-{n:03d}.json'))
              assert tr['scene_status']=='verified' and tr['source_scene_number']==n
              ids=[u['id'] for u in tr['units']]
              assert ids==[f'naam-en-s{n:03d}-u{i:03d}' for i in range(1,len(ids)+1)]
              linked=[u['source']['source_record_id'] for u in tr['units'] if u['source']['source_record_id']]
              assert linked==[r['id'] for r in src] and len(linked)==count
              byid={r['id']:r for r in src}
              for u in tr['units']:
                  rid=u['source']['source_record_id']
                  if rid:
                      r=byid[rid]
                      assert u['source']['speaker_label']==r['speaker_label']
                      assert u['source']['source_delimiter']==r['source_delimiter']
                      assert u['source']['page_provenance']==r['page_provenance']
                  if u['kind']=='dialogue' and rid is None: unlabelled.append(u['id'])
                  o=u['source']['source_occurrence_id']
                  if o and o not in occ: occ.append(o)
                  maps += len(u['translation'].get('line_map',[]))
              total_links+=len(linked); total_units+=tr['unit_count']
          assert total_links==180
          assert unlabelled==['naam-en-s010-u021','naam-en-s013-u033','naam-en-s013-u037']
          assert set(occ)=={'naam-perf-001','naam-perf-002'} and maps==34
          qa=json.load(open('works/naam/translations/batch-006-015-qa.json'))
          assert qa['status']=='PASS' and qa['translation_units']==total_units
          assert qa['dialogue_coverage']=='180/180 exactly once' and qa['source_unlabelled_speech_units']==3
          assert qa['performance_coverage']=='2/2' and qa['performance_line_cue_mappings']==34
          assert qa['specific_bharathiyar_attribution_preserved_for']=='naam-perf-001'
          assert qa['naam_perf_002_authorship']=='unresolved-item-level'
          idx=json.load(open('works/naam/translations/index.json'))
          assert idx['status']=='in-progress-verified-through-scene-015' and idx['verified_scenes']==15
          assert idx['translation_units_verified']==131+total_units
          assert idx['immutable_dialogue_links_verified']==279
          assert idx['source_unlabelled_speech_units_verified']==4
          assert idx['retained_performance_records_translated']==3 and idx['song_line_cue_mappings_verified']==57
          assert idx['iteration_scene_batch_size']==10 and 'scenes 16–25' in idx['next_activity']
          PY

      - name: Verify upstream layers unchanged
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          roots=['works/naam/transcription','works/naam/scenes','works/naam/dialogues','works/naam/characters','works/naam/songs/records']
          def digest(root):
              h=hashlib.sha256()
              for p in sorted(Path(root).rglob('*')):
                  if p.is_file():
                      h.update(str(p).encode()); h.update(b'\0'); h.update(p.read_bytes()); h.update(b'\0')
              return h.hexdigest()
          before=json.loads(Path('/tmp/naam-upstream-before.json').read_text())
          after={r:digest(r) for r in roots}
          assert before==after,(before,after)
          PY

      - name: Validate synchronized active mirrors
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          idx=json.load(open('works/naam/translations/index.json')); u=idx['translation_units_verified']
          m=Path('works/naam/metadata.yaml').read_text(encoding='utf-8')
          for x in ['english_translation: in-progress-verified-15-of-45','english_translation_verified_scenes: 15','english_dialogue_links_verified: 279','english_performance_records_translated: 3','english_song_line_cue_mappings_verified: 57']:
              assert x in m
          assert f'english_translation_unit_count: {u}' in m
          wr=Path('works/naam/README.md').read_text(encoding='utf-8'); assert 'English translation: **15/45 VERIFIED' in wr
          nxt=Path('works/naam/NEXT_CHAT_PROMPT.md').read_text(encoding='utf-8'); assert 'VERIFIED THROUGH SOURCE SCENE 15' in nxt and 'source-numbered scenes 16–25' in nxt and '10 source scenes' in nxt
          root=Path('README.md').read_text(encoding='utf-8'); assert 'English translation: **15/45 VERIFIED' in root
          hand=Path('docs/HANDOVER_KALAIGNAR_CINEMA_WORKS.md').read_text(encoding='utf-8'); audit=Path('docs/STATUS_CONSISTENCY_AUDIT.md').read_text(encoding='utf-8')
          assert 'Naam English scenes 6-15 current' in hand and 'Naam English scenes 6-15 current' in audit
          data=json.load(open('data/works.json')); sd=next(x for x in data if x.get('id')=='naam')['structured_derivatives']
          assert sd['english_translation_verified_scenes']==15 and sd['english_translation_units']==u and sd['english_dialogue_links_verified']==279
          assert sd['english_source_unlabelled_speech_units']==4 and sd['english_performance_records_translated']==3 and sd['english_song_line_cue_mappings_verified']==57 and sd['english_iteration_scene_batch_size']==10
          PY

      - name: Commit verified scenes 6-15 batch
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No scenes 6-15 synchronization changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md data/works.json docs/HANDOVER_KALAIGNAR_CINEMA_WORKS.md docs/STATUS_CONSISTENCY_AUDIT.md works/naam
          git commit -m 'Verify Naam English scenes 6-15 [skip ci]'
          git push
