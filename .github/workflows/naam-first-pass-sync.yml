name: Naam whole-work English reconciliation

on:
  push:
    branches: [main]
    paths:
      - 'works/naam/**'
      - 'data/works.json'
      - 'README.md'
      - 'docs/HANDOVER_KALAIGNAR_CINEMA_WORKS.md'
      - 'docs/STATUS_CONSISTENCY_AUDIT.md'
      - '.github/scripts/naam_english_whole_work_reconcile_v2.py'
      - '.github/workflows/naam-first-pass-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Snapshot immutable upstream layers
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          roots=['works/naam/transcription','works/naam/scenes','works/naam/dialogues','works/naam/characters','works/naam/songs/records']
          def digest(root):
              h=hashlib.sha256()
              for p in sorted(Path(root).rglob('*')):
                  if p.is_file():
                      h.update(str(p).encode()); h.update(b'\0'); h.update(p.read_bytes()); h.update(b'\0')
              return h.hexdigest()
          Path('/tmp/naam-upstream-before.json').write_text(json.dumps({r:digest(r) for r in roots}),encoding='utf-8')
          PY

      - name: Validate reconciliation entry gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          assert json.load(open('works/naam/transcription/index.json'))['status']=='complete-verified'
          assert json.load(open('works/naam/scenes/index.json'))['status']=='complete-verified'
          assert json.load(open('works/naam/scenes/index.json'))['source_scene_count']==45
          assert json.load(open('works/naam/dialogues/index.json'))['dialogue_record_count']==590
          assert json.load(open('works/naam/characters/index.json'))['dialogue_record_coverage']=='590/590'
          songs=json.load(open('works/naam/songs/inventory.json'))
          assert songs['coverage']=='7/7' and songs['source_attributed_authorship_records']==1 and songs['unresolved_item_level_authorship_records']==6
          perf1=next(x for x in songs['records'] if x['id']=='naam-perf-001')
          assert perf1['authorship_status']=='source-attributed' and perf1['author_as_printed']=='பாரதியார்'
          e=json.load(open('works/naam/translations/index.json'))
          assert e['status']=='scene-layer-complete-verified-45-of-45-whole-work-reconciliation-next'
          assert e['verified_scenes']==45 and e['translation_units_verified']==797
          assert e['immutable_dialogue_links_verified']==590 and e['source_unlabelled_speech_units_verified']==20
          assert e['retained_performance_records_translated']==7 and e['song_line_cue_mappings_verified']==138
          assert e['source_chant_units_verified']==1 and e['source_chant_line_cue_mappings_verified']==16
          assert e['whole_work_reconciliation_status']=='ready-next'
          for n in range(1,46): assert Path(f'works/naam/translations/records/scene-{n:03d}.json').exists()
          for p in ['pilot-qa.json','batch-002-005-qa.json','batch-006-015-qa.json','batch-016-025-qa.json','batch-026-035-qa.json','batch-036-045-qa.json']:
              assert json.load(open('works/naam/translations/'+p))['status']=='PASS'
          PY

      - name: Run whole-work English reconciliation
        run: python .github/scripts/naam_english_whole_work_reconcile_v2.py

      - name: Validate reconciliation closure
        run: |
          python -m json.tool works/naam/translations/index.json >/dev/null
          python -m json.tool works/naam/translations/whole-work-reconciliation.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.load(open('works/naam/translations/whole-work-reconciliation.json'))
          assert q['status']=='PASS' and q['source_scenes_verified']==45 and q['translation_units_verified']==797
          assert q['unit_ids_unique_and_sequential'] is True and q['source_order_failures']==[]
          assert q['immutable_dialogue_records_linked']==590 and q['immutable_dialogue_ids_unique'] is True and q['dialogue_source_order_exact'] is True
          assert q['source_unlabelled_speech_units']==20 and q['source_unlabelled_speaker_assignments']==0 and q['source_unlabelled_units_supported_by_audit_scene_page']==20
          assert q['retained_performance_records_translated']==7 and q['performance_line_cue_mappings']==138
          assert q['specific_source_authorship_preserved']=={'naam-perf-001':'பாரதியார்'} and q['unsupported_authorship_upgrades']==0
          assert q['source_local_chant_units']==['naam-en-s034-u002'] and q['source_local_chant_line_cue_mappings']==16 and q['source_local_chant_promoted_to_performance_inventory'] is False
          assert q['written_text_units']==['naam-en-s041-u012','naam-en-s045-u025'] and q['cross_page_unit_count']==12
          assert q['provenance_out_of_scene_bounds']==[] and q['duplicate_non_dialogue_source_owners']==[] and q['placeholder_hits']==[] and q['synthetic_scene_end_hits']==[]
          assert q['upstream_source_layers_modified'] is False and q['reader_export_gate']=='READY-NEXT'
          kinds=q['kind_counts']; assert kinds['dialogue']==610 and kinds['song']==6 and kinds['chant']==1 and kinds['performance-cue']==6 and kinds['written-text']==2
          assert q['stage_or_narrative_units']==172 and sum(kinds.values())==797
          idx=json.load(open('works/naam/translations/index.json'))
          assert idx['status']=='complete-verified' and idx['whole_work_reconciliation_status']=='PASS' and idx['reader_export_status']=='ready-next'
          assert idx['translation_units_verified']==797 and idx['immutable_dialogue_links_verified']==590 and idx['retained_performance_records_translated']==7 and idx['song_line_cue_mappings_verified']==138
          assert 'PASS / COMPLETE-VERIFIED' in Path('works/naam/translations/WHOLE_WORK_RECONCILIATION.md').read_text(encoding='utf-8')
          PY

      - name: Verify immutable upstream layers unchanged
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          roots=['works/naam/transcription','works/naam/scenes','works/naam/dialogues','works/naam/characters','works/naam/songs/records']
          def digest(root):
              h=hashlib.sha256()
              for p in sorted(Path(root).rglob('*')):
                  if p.is_file(): h.update(str(p).encode());h.update(b'\0');h.update(p.read_bytes());h.update(b'\0')
              return h.hexdigest()
          before=json.loads(Path('/tmp/naam-upstream-before.json').read_text());after={r:digest(r) for r in roots};assert before==after
          q=json.load(open('works/naam/translations/whole-work-reconciliation.json'));assert q['upstream_integrity_before']==q['upstream_integrity_after']==before
          PY

      - name: Validate active mirror synchronization and stale-state closure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=Path('works/naam/metadata.yaml').read_text(encoding='utf-8')
          for x in ['english_translation: complete-verified','english_translation_verified_scenes: 45','english_translation_unit_count: 797','english_dialogue_links_verified: 590','english_performance_records_translated: 7','english_song_line_cue_mappings_verified: 138','english_whole_work_reconciliation: PASS','english_reader_export: ready-next','english_translation: complete-verified-45-of-45','reader_export: ready-next']: assert x in m,x
          assert 'english_translation: in-progress-verified-25-of-45' not in m and 'english_whole_work_reconciliation: ready-next' not in m
          wr=Path('works/naam/README.md').read_text(encoding='utf-8'); assert 'English translation: **45/45 COMPLETE-VERIFIED' in wr and 'English whole-work reconciliation closure' in wr
          ph=Path('works/naam/PROJECT_HANDOVER.md').read_text(encoding='utf-8');top=ph.split('## Source identity',1)[0]
          assert 'English: **45/45 COMPLETE-VERIFIED' in top and 'reader/export: **READY-NEXT**' in top and 'Phase 10 whole-work reader/export' in top and 'scene derivatives: **not-started / ready**' not in top
          nxt=Path('works/naam/NEXT_CHAT_PROMPT.md').read_text(encoding='utf-8'); assert 'English translation is **COMPLETE-VERIFIED**' in nxt and 'Reader/export is **READY-NEXT**' in nxt and 'Phase 10 whole-work reader/export' in nxt
          data=json.load(open('data/works.json'));sd=next(x for x in data if x.get('id')=='naam')['structured_derivatives'];assert sd['english_translation']=='complete-verified' and sd['english_whole_work_reconciliation']=='PASS' and sd['reader_export']=='ready-next'
          assert 'Naam English whole-work closure current' in Path('README.md').read_text(encoding='utf-8')
          assert 'Naam English whole-work closure current' in Path('docs/HANDOVER_KALAIGNAR_CINEMA_WORKS.md').read_text(encoding='utf-8')
          assert 'Naam English whole-work closure current' in Path('docs/STATUS_CONSISTENCY_AUDIT.md').read_text(encoding='utf-8')
          PY

      - name: Commit whole-work English closure
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo 'No reconciliation synchronization changes needed.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md data/works.json docs/HANDOVER_KALAIGNAR_CINEMA_WORKS.md docs/STATUS_CONSISTENCY_AUDIT.md works/naam
          git commit -m 'Close Naam English whole-work reconciliation [skip ci]'
          git push
