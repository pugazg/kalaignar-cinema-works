name: Naam dialogue preflight synchronization

on:
  push:
    branches: [main]
    paths:
      - 'works/naam/**'
      - '.github/workflows/naam-first-pass-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build dialogue preflight when pending
        run: |
          python - <<'PY'
          import json
          s=json.load(open('works/naam/scenes/index.json'))
          assert s['status']=='complete-verified'
          assert s['source_scene_count']==45
          PY
          if [ ! -f works/naam/notes/dialogue-index-preflight.json ]; then
            python works/naam/scripts/build_dialogue_preflight.py
          else
            echo 'Naam dialogue preflight already exists or is superseded.'
          fi

      - name: Validate dialogue preflight
        run: |
          python -m json.tool works/naam/notes/dialogue-index-preflight.json >/dev/null
          python - <<'PY'
          import json
          d=json.load(open('works/naam/notes/dialogue-index-preflight.json'))
          assert d['status']=='review-ready'
          assert d['scene_count']==45
          assert d['source_numbered_scenes'] is True
          assert d['explicit_dialogue_candidates'] > 0
          assert len(d['scene_dialogue_candidate_counts'])==45
          assert d['distinct_exact_speaker_labels'] > 0
          PY

      - name: Commit dialogue preflight
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No dialogue-preflight changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add works/naam/notes/dialogue-index-preflight.json works/naam/notes/dialogue-index-preflight.md
          git commit -m 'Inventory Naam dialogue labels [skip ci]'
          git push
