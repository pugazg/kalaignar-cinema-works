name: One-off Ammayappan fidelity PDF 5-24

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ammaiyappan-fidelity-005-024.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fidelity synchronization
        run: python .github/scripts/ammaiyappan_fidelity_005_024.py
      - name: Commit synchronized checkpoint
        run: |
          rm -f .github/workflows/ammaiyappan-fidelity-005-014.yml
          rm -f .github/workflows/ammaiyappan-fidelity-005-024.yml
          rm -f .github/scripts/ammaiyappan_fidelity_005_024.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Verify Ammayappan PDF 5-24 fidelity"
          git push
