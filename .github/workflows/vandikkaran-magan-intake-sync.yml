name: Vandikkaran Magan intake synchronization

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate closed intake checkpoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.load(open('data/works.json'))
          x=next(i for i in data if i.get('id')=='vandikkaran-magan')
          assert x['structural_mapping']=='complete-verified'
          assert x['scene_heading_occurrences_observed']==70
          assert Path('works/vandikkaran-magan/mapping.md').exists()
          print('Closed intake checkpoint remains available for manual revalidation only.')
          PY
