name: One-off Ammayappan fidelity PDF 55-64

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ammaiyappan-fidelity-055-064.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply PDF 55-64 fidelity reconciliation
        run: python scripts/oneoff-ammaiyappan-fidelity-055-064.py
      - name: Commit synchronized checkpoint and remove one-off files
        run: |
          rm -f scripts/oneoff-ammaiyappan-fidelity-055-064.py
          rm -f .github/workflows/ammaiyappan-fidelity-055-064.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Verify Ammayappan PDF 55-63 fidelity; review PDF 64'
          git push origin HEAD:main