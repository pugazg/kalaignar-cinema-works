name: One-off Ammayappan resolve PDF 64 marker 47

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ammaiyappan-resolve-pdf64.yml'

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve PDF 64 marker 47 and synchronize status
        run: python scripts/oneoff-ammaiyappan-resolve-pdf64.py
      - name: Commit synchronized checkpoint and remove one-off files
        run: |
          rm -f scripts/oneoff-ammaiyappan-resolve-pdf64.py
          rm -f .github/workflows/ammaiyappan-resolve-pdf64.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Resolve Ammayappan PDF 64 marker 47; verify through PDF 64'
          git push origin HEAD:main