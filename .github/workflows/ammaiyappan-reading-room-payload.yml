name: Ammayappan Reading Room payload QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "works/ammaiyappan/scenes/**"
      - "works/ammaiyappan/dialogues/records/**"
      - "works/ammaiyappan/dialogues/source-role-resolved-records.json"
      - "works/ammaiyappan/songs/inventory.json"
      - "works/ammaiyappan/translations/records/**"
      - "works/ammaiyappan/translations/index.json"
      - "works/ammaiyappan/editions/en/audit_probe.py"
      - "works/ammaiyappan/editions/en/build.py"
      - "works/ammaiyappan/editions/en/reader-edition.json"
      - "works/ammaiyappan/editions/en/manifest.json"
      - "works/ammaiyappan/integrations/reading-room/build.py"
      - ".github/workflows/ammaiyappan-reading-room-payload.yml"

permissions:
  contents: write

jobs:
  payload-qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Re-run whole-work English reader preflight
        run: python works/ammaiyappan/editions/en/audit_probe.py

      - name: Rebuild and verify deterministic English reader
        run: |
          python works/ammaiyappan/editions/en/build.py
          git diff --exit-code -- \
            works/ammaiyappan/editions/en/reader-edition.md \
            works/ammaiyappan/editions/en/reader-edition.html \
            works/ammaiyappan/editions/en/reader-edition.json \
            works/ammaiyappan/editions/en/QA_REPORT.md \
            works/ammaiyappan/editions/en/manifest.json

      - name: Build and validate Reading Room payload
        run: python works/ammaiyappan/integrations/reading-room/build.py

      - name: Commit verified payload
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            works/ammaiyappan/integrations/reading-room/README.md \
            works/ammaiyappan/integrations/reading-room/reading-room.json \
            works/ammaiyappan/integrations/reading-room/QA_REPORT.md \
            works/ammaiyappan/integrations/reading-room/manifest.json
          if git diff --cached --quiet; then
            echo "Reading Room payload is already reproducible; nothing to commit."
          else
            git commit -m "Build Ammayappan Reading Room payload [skip ci]"
            git push
          fi
