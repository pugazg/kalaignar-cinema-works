# மருதநாட்டு இளவரசி

ராணி:- அப்பா!

மணி:- எனக்காக நீ இந்த தியாகம்கூடவா செய்யக் கூடாது?

ராணி:- தங்களுக்காக உயிரைத் தியாகம் செய்கிறேன். மானம் தியாகம் செய்யும் பொருள் அல்ல தந்தையே!

மணி:- ராணி! வெற்றி அவர்கள் பக்கமென்றால் நம் மானம் என்னாவது?

ராணி:- வெற்றி! அது வீரர்களின் ரத்தம் நிர்ணயிக்க வேண்டிய முடிவு! அதைப்பற்றி இப்போது என்ன கவலை.

மணி:- வீரர்களின் பலமும், என் பலமும் எனக்குத் தெரியும். உன் உபதேசம் வேண்டாம்.

ராணி:- அப்பா! தாங்களா இப்படிப் பேசுகிறீர்கள்! வேலும், வாளும், வாழ்க்கையில் தோழனென்று கூறும் வம்சத்தில் பிறந்த தாங்களா இப்படிப் பேசுகிறீர்கள்! வெண்கொடுமை சாக்காட்டில், விளையாடும் தோளெங்கள் வெற்றித் தோள்கள் என்று வீரப்பாண்டிய பரம்பரையில் பிறந்த தாங்களா இப்படிப் பேசுகிறீர்கள்? ஈட்டியின் பாய்ச்சல் கண்டு இமை கொட்டியவன் கோழை! இதை இதய கீதமாக்கிக்கொண்ட தமிழனுக்குப் பிறந்த தாங்களா இப்படிப் பேசுகிறீர்கள்? வெட்கம், இழிவு, நம் நாட்டு சரித்திரத்திற்கே இழிவு. களம் பலகண்ட கதிரவன் சிரிப்பான்! வீரர்களைத் தாங்கிய இந்த பூமி சிரிக்கும். வேண்டாமப்பா! வீர வரலாற்றில் களங்கம் வேண்டாம். மரணத்திற்குப் பயந்து, மாற்றானுக்கு மகள் கப்பமாக அளித்தார் மணிபல்லவர் என்று மாநிலம் சிரிக்கும். அந்த மாசு படிய வேண்டாம்.

மணி:- வேண்டாம் ராணி! உணர்ச்சியற்ற என் உள்ளத்தை சம்மட்டியால் அடிக்க வேண்டாம். புழுவாய் நெளிந்த என்னை புலியாக மாற்றிவிட்டாய்! கண்ணைப்போல் காப்பதை, அந்தக் கரடிவாயில் தள்ள மாட்டேன்! கொக்
