name: Vandikkaran Magan scene-5 checkpoint sync once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/vm-sync-audit-once.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize active work and repository mirrors
        run: python works/vandikkaran-magan/scripts/sync_translation_batch_005.py
      - name: Validate active current-state mirrors
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          w=Path('works/vandikkaran-magan')
          d=json.loads((w/'dialogues/index.json').read_text(encoding='utf-8'))
          c=json.loads((w/'characters/index.json').read_text(encoding='utf-8'))
          t=json.loads((w/'translations/index.json').read_text(encoding='utf-8'))
          assert d['dialogue_record_count']==773 and d['delimiter_distribution']=={':':8,':—':765}
          assert c['dialogue_records_source']==773 and c['dialogue_record_coverage']=='773/773'
          assert t['verified_scenes']==5 and t['translation_units']==88 and t['immutable_dialogue_records_linked']==65
          active=[w/'README.md',w/'PROJECT_HANDOVER.md',w/'NEXT_CHAT_PROMPT.md',w/'metadata.yaml',w/'mapping.md',w/'transcription/README.md',w/'scenes/README.md',w/'characters/README.md',w/'songs/README.md',Path('README.md'),Path('docs/HANDOVER_KALAIGNAR_CINEMA_WORKS.md'),Path('docs/STATUS_CONSISTENCY_AUDIT.md')]
          for p in active:
              s=p.read_text(encoding='utf-8')
              assert 'English translation: **READY-NEXT**' not in s, p
              assert 'english_translation: ready-next' not in s, p
              assert 'Begin a bounded English-translation pilot from source scene 1' not in s, p
          print('PASS active synchronization gate')
          PY
      - name: Commit synchronized checkpoint and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/vm-sync-audit-once.yml
          git add -A
          git commit -m 'Synchronize Vandikkaran Magan English scene-5 checkpoint [skip ci]'
          git push
