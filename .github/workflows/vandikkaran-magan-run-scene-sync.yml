name: Vandikkaran Magan run scene checkpoint sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vandikkaran-magan-run-scene-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synchronize scene checkpoint
        run: python works/vandikkaran-magan/scripts/sync_scene_checkpoint.py
      - name: Commit synchronized checkpoint
        shell: bash
        run: |
          rm .github/workflows/vandikkaran-magan-run-scene-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Sync Vandikkaran Magan scene closure [skip ci]"
          git push origin HEAD:main
