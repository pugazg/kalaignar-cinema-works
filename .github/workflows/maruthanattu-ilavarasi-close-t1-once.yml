name: Maruthanattu Ilavarasi close Tamil T1 once
# retry after output-normalization
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maruthanattu-ilavarasi-close-t1-once.yml'
permissions:
  contents: write

jobs:
  close-t1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate closure
        run: python works/maruthanattu-ilavarasi/scripts/close_t1.py
      - name: Commit and self-delete
        run: |
          rm .github/workflows/maruthanattu-ilavarasi-close-t1-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Complete Maruthanattu Ilavarasi Tamil T1 [skip ci]'
          git push origin main
