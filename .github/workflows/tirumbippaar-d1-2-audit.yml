name: Tirumbippaar D1.2 scene fidelity audit

on:
  push:
    branches:
      - audit/tirumbippaar-d1-2-scan-fidelity
    paths:
      - "works/tirumbippaar/tools/d1_2_scene_fidelity_audit.py"
      - "works/tirumbippaar/notes/d1-2-repair-chunks/**"
      - "works/tirumbippaar/transcription/parts/**"
      - "works/tirumbippaar/scenes/**"
      - ".github/workflows/tirumbippaar-d1-2-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decode scan-adjudicated repair patch from verified chunks
        run: |
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          root = Path("works/tirumbippaar/notes/d1-2-repair-chunks")
          parts = sorted(root.glob("part-*.b64"))
          assert [p.name for p in parts] == [f"part-{i:02d}.b64" for i in range(1, 8)], [p.name for p in parts]
          payload = "".join(p.read_text(encoding="ascii") for p in parts)
          assert len(payload) == 27064, len(payload)
          raw = base64.b64decode(payload, validate=True)
          assert hashlib.sha256(raw).hexdigest() == "404a4ba11ba2df902ce8e3f76f890d45f8603fd1139462932721a61ced678833"
          patch = gzip.decompress(raw)
          assert len(patch) == 145524, len(patch)
          assert hashlib.sha256(patch).hexdigest() == "adc30c64e964928d5a09b4b7b599ca5c98c3230c0e73fda58d5c3cf75d30b941"
          assert patch.startswith(b"--- a/works/tirumbippaar/")

          # The locally assembled unified patch contained one transport-format
          # defect at the EOF-only Part04 hunk: the removed and added copies of
          # the final line were concatenated because the source file itself had
          # no trailing newline. Repair only that patch syntax here; the Tamil
          # text on both sides remains byte-for-byte identical.
          text = patch.decode("utf-8")
          old = "-புண்யகோடி: பதறாம என்ன பண்றது. சொந்த விஷயத்துக்காக புரட்சி பண்ணச் சொல்லி இவ்வளவு ஏழைகளோட+புண்யகோடி: பதறாம என்ன பண்றது. சொந்த விஷயத்துக்காக புரட்சி பண்ணச் சொல்லி இவ்வளவு ஏழைகளோட"
          new = "-புண்யகோடி: பதறாம என்ன பண்றது. சொந்த விஷயத்துக்காக புரட்சி பண்ணச் சொல்லி இவ்வளவு ஏழைகளோட\n\\ No newline at end of file\n+புண்யகோடி: பதறாம என்ன பண்றது. சொந்த விஷயத்துக்காக புரட்சி பண்ணச் சொல்லி இவ்வளவு ஏழைகளோட"
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)
          patch = text.encode("utf-8")
          assert len(patch) == 145553, len(patch)
          assert hashlib.sha256(patch).hexdigest() == "05b6a3a8e8b6baa9feff0703539a6ea5847075d8aed4eddcf81ddfef586a94dd"
          Path("/tmp/d1-2-scan-repairs.patch").write_bytes(patch)
          print("Verified and syntax-repaired D1.2 patch: 145,553 bytes")
          PY
      - name: Apply scan-adjudicated D1.2 repairs
        run: |
          if git apply --check /tmp/d1-2-scan-repairs.patch; then
            git apply /tmp/d1-2-scan-repairs.patch
            echo "Applied D1.2 scan repair set"
          elif git apply --reverse --check /tmp/d1-2-scan-repairs.patch; then
            echo "D1.2 scan repair set is already applied"
          else
            echo "Repair patch is neither cleanly applicable nor already applied"
            exit 1
          fi
      - name: Generate strict canonical/scene audit report
        run: python works/tirumbippaar/tools/d1_2_scene_fidelity_audit.py
      - name: Enforce zero unexplained textual/page mismatches
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("works/tirumbippaar/notes/d1-2-scene-fidelity-audit.generated.json")
          gate = json.loads(p.read_text(encoding="utf-8"))["gate"]
          assert gate["aligned_pairs"] == 1348, gate
          assert gate["exact_text"] == 1348, gate
          assert gate["exact_text_and_page"] == 1348, gate
          assert gate["mismatch_count_including_page"] == 0, gate
          assert gate["class_counts"] == {}, gate
          assert gate["unaligned_blocks"] == 4, gate
          expected = {
              ("works/tirumbippaar/transcription/parts/part-03-pdf-36-63.md", "[பூமாலை வீடு- பகல்"),
              ("works/tirumbippaar/transcription/parts/part-03-pdf-36-63.md", "(கருடன் பதிப்பகம்"),
              ("works/tirumbippaar/transcription/parts/part-04-pdf-64-91.md", "[குமுதா மதறாஸ் வீடு : ஹால்"),
              ("works/tirumbippaar/transcription/parts/part-05-pdf-92-112.md", "(ஹோட்டல் அறை-பகல்"),
          }
          actual = set()
          for block in gate["unaligned"]:
              assert block["tag"] == "delete" and not block["scene"], block
              assert len(block["canonical"]) == 1, block
              item = block["canonical"][0]
              actual.add((item["path"], item["text"]))
          assert actual == expected, (actual, expected)
          print("D1.2 gate PASS: 1348/1348 exact text+page, 0 mismatches; four excluded structural location-header lines accounted for")
          PY
      - name: Upload mismatch audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: tirumbippaar-d1-2-audit
          path: |
            works/tirumbippaar/notes/d1-2-scene-fidelity-audit.generated.json
            works/tirumbippaar/notes/d1-2-scene-fidelity-mismatches.generated.tsv
          if-no-files-found: error
      - name: Upload Tirumbippaar work snapshot
        uses: actions/upload-artifact@v4
        with:
          name: tirumbippaar-d1-2-work-snapshot
          path: works/tirumbippaar
          if-no-files-found: error
      - name: Commit scan repairs and generated audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            works/tirumbippaar/transcription/parts \
            works/tirumbippaar/scenes \
            works/tirumbippaar/notes/d1-2-scene-fidelity-audit.generated.json \
            works/tirumbippaar/notes/d1-2-scene-fidelity-mismatches.generated.tsv
          if git diff --cached --quiet; then
            echo "D1.2 scan repairs and audit report are already committed"
          else
            git commit -m "fix(tirumbippaar): apply scan-adjudicated D1.2 fidelity repairs [skip ci]"
            git push
          fi
