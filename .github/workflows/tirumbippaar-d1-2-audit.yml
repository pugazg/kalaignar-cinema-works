name: Tirumbippaar D1.2 scene fidelity audit

on:
  push:
    branches:
      - audit/tirumbippaar-d1-2-scan-fidelity
    paths:
      - "works/tirumbippaar/tools/d1_2_scene_fidelity_audit.py"
      - "works/tirumbippaar/transcription/parts/**"
      - "works/tirumbippaar/scenes/**"
      - ".github/workflows/tirumbippaar-d1-2-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate strict canonical/scene audit report
        run: python works/tirumbippaar/tools/d1_2_scene_fidelity_audit.py
      - name: Upload mismatch audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: tirumbippaar-d1-2-audit
          path: |
            works/tirumbippaar/notes/d1-2-scene-fidelity-audit.generated.json
            works/tirumbippaar/notes/d1-2-scene-fidelity-mismatches.generated.tsv
          if-no-files-found: error
      - name: Commit generated audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            works/tirumbippaar/notes/d1-2-scene-fidelity-audit.generated.json \
            works/tirumbippaar/notes/d1-2-scene-fidelity-mismatches.generated.tsv
          if git diff --cached --quiet; then
            echo "Audit report unchanged"
          else
            git commit -m "audit(tirumbippaar): generate D1.2 strict mismatch report [skip ci]"
            git push
          fi
