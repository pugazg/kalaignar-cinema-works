name: One-off Ammayappan fidelity PDF 65-74

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ammaiyappan-fidelity-065-074.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize stale handover wording for strict sync
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('works/ammaiyappan/PROJECT_HANDOVER.md')
          s = p.read_text(encoding='utf-8')
          old = '- visual fidelity audit: **in-progress — 60/105 verified; next PDF 65 / logical p.63**;'
          new = '- visual fidelity audit: **in-progress — 60/105 verified**;'
          if old not in s:
              raise SystemExit('expected handover phase-gate wording not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply PDF 65-74 fidelity reconciliation
        run: python scripts/oneoff-ammaiyappan-fidelity-065-074.py
      - name: Commit checkpoint and remove one-off files
        run: |
          rm -f scripts/oneoff-ammaiyappan-fidelity-065-074.py
          rm -f .github/workflows/ammaiyappan-fidelity-065-074.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Verify Ammayappan PDF 66-74; review PDF 65'
          git push origin HEAD:main
