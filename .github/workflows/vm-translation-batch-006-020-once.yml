name: Vandikkaran Magan English scenes 6-20 once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/vm-translation-batch-006-020-once.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Compile and build verified 15-scene English batch
        run: |
          python -m py_compile works/vandikkaran-magan/scripts/build_translation_batch_006_020.py
          python works/vandikkaran-magan/scripts/build_translation_batch_006_020.py
      - name: Protect closed upstream authorities
        run: |
          if git diff --name-only | grep -E '^works/vandikkaran-magan/(transcription/pages/|scenes/scene-[0-9]+\.md$|dialogues/records/|songs/records/|characters/entities\.json$|characters/record-dispositions\.json$)'; then
            echo 'ERROR: closed upstream authority changed' >&2
            exit 1
          fi
      - name: Commit batch and synchronized checkpoint
        run: |
          rm .github/workflows/vm-translation-batch-006-020-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Verify Vandikkaran Magan English scenes 6-20 [skip ci]'
          git push origin main
