name: Vandikkaran Magan sync scene derivative closure

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vandikkaran-magan-sync-scene-closure.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synchronize scene closure mirrors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          W = Path('works/vandikkaran-magan')

          def read(path):
              return Path(path).read_text(encoding='utf-8')
          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')
          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing expected text for {label}: {old!r}')
              return text.replace(old, new)

          # Correct the authoritative scene-heading audit: canonical PDF 10 contains
          # a source-visible 4-எ heading missed by the older 71-heading inventory.
          p = W/'notes/scene-heading-audit.md'
          t = p.read_text(encoding='utf-8')
          old_para = "The first-pass transcription of PDF 83 exposed a source-visible **`காட்சி -- 53 டி`** heading. It was absent from the earlier 70-heading map. The controlling scan therefore establishes **71 observed scene-heading occurrences**, with `53-டி` starting at PDF 83 / printed p.82."
          new_para = "Canonical derivative construction exposed one additional source-visible boundary that the earlier inventory missed: PDF 10 / printed p.9 contains **`காட்சி — 4 எ.`**, retained as source scene ID `4-எ`. The first-pass transcription had also exposed PDF 83 / printed p.82 **`காட்சி -- 53 டி`**. The controlling scan and closed canonical Tamil therefore establish **72 observed scene-heading occurrences**."
          t = must_replace(t, old_para, new_para, 'scene-audit corrective paragraph')
          lines = t.splitlines()
          out=[]; inserted=False
          for line in lines:
              m=re.match(r'^\|\s*(\d+)\s*\|\s*`([^`]+)`\s*\|\s*(\d+)\s*\|\s*(\d+)\s*\|$', line)
              if m:
                  n=int(m.group(1))
                  if n >= 5:
                      n += 1
                  if not inserted and m.group(2)=='5':
                      out.append('| 5 | `4-எ` | 10 | 9 |')
                      inserted=True
                  line=f'| {n} | `{m.group(2)}` | {m.group(3)} | {m.group(4)} |'
              out.append(line)
          if not inserted:
              raise SystemExit('failed to insert 4-எ audit row')
          t='\n'.join(out)+'\n'
          t=t.replace('observed heading occurrences: **71**;', 'observed heading occurrences: **72**;')
          t=t.replace('unsuffixed/combined headings: **55**;\n- suffix insertions: **16**;', 'unsuffixed/combined headings: **55**;\n- suffix insertions: **17**;')
          t=t.replace('suffix insertions: `10-எ`,', 'suffix insertions: `4-எ`, `10-எ`,')
          t=t.replace('at **71/71 observed headings**', 'at **72/72 observed headings**')
          p.write_text(t, encoding='utf-8')

          # Work README.
          p=W/'README.md'; t=p.read_text(encoding='utf-8')
          t=t.replace('The source has **71 observed scene-heading occurrences**. The identifying sequence includes base numbers **1–56**, **16 suffix insertions**, and the combined source heading **`45-46`**.', 'The closed canonical screenplay has **72 source-visible scene-heading occurrences**. The identifying sequence includes base numbers **1–56**, **17 suffix insertions**, and the combined source heading **`45-46`**. The late structural reconciliation adds source-visible `4-எ` at PDF 10 / printed p.9.')
          t=t.replace('`10-எ`, `14-எ`', '`4-எ`, `10-எ`, `14-எ`')
          t=t.replace('- scene-text derivatives: **READY-NEXT**;\n- dialogue index: **BLOCKED pending scene QA**;', '- scene-text derivatives: **72/72 COMPLETE-VERIFIED — boundary QA PASS / 0 gaps / 0 overlaps**;\n- dialogue index: **READY-NEXT — preflight not started**;')
          old='> **Build scene-text derivatives for the 71 observed/canonical source scene dispositions from screenplay PDF 6–87. Preserve exact source headings/location captions, source order and page anchors; assemble cross-page scenes without duplicate source ownership; keep decorative `★` separators structural; exclude PDF 4–5 and PDF 88–90 from synthetic scene creation; create the scene index; and run boundary-ownership QA proving 0 gaps / 0 overlaps before the scene layer is marked complete.**'
          new='> **Begin the dialogue-index preflight from the 72/72 complete-verified source-led scene layer. Inventory every explicit source speaker label and delimiter exactly as printed, preserve source scene and PDF provenance, flag non-standard delimiter and cross-page continuation candidates for review, exclude stage/location/separator text from immutable dialogue starts, and do not normalize aliases. Commit/push the review-ready preflight before immutable dialogue generation.**'
          t=must_replace(t, old, new, 'README next action'); p.write_text(t, encoding='utf-8')

          # Project handover.
          p=W/'PROJECT_HANDOVER.md'; t=p.read_text(encoding='utf-8')
          t=t.replace('`notes/scene-heading-audit.md` records **71 observed source scene-heading occurrences**.', '`notes/scene-heading-audit.md` now records **72 source-visible scene-heading occurrences**, including the late-reconciled source boundary `4-எ` at PDF 10 / printed p.9.')
          t=t.replace('`1, 2, 3, 4, 5, 6,', '`1, 2, 3, 4, 4-எ, 5, 6,')
          t=t.replace('structural mapping / scene-heading audit: **COMPLETE-VERIFIED / 71 headings**;', 'structural mapping / scene-heading audit: **COMPLETE-VERIFIED / 72 headings**;')
          t=t.replace('- scene-text derivatives: **READY-NEXT / NOT-STARTED**;\n- dialogue index: **BLOCKED until scene layer + boundary QA close**;', '- scene-text derivatives: **72/72 COMPLETE-VERIFIED — boundary ownership QA PASS / 0 gaps / 0 overlaps / 82 screenplay pages represented**;\n- dialogue index: **READY-NEXT — preflight not started**;')
          old='> **Build the scene-text derivative layer for the complete verified screenplay PDF 6–87 using all 71 observed/canonical source scene dispositions. Create `scenes/index.json` plus one scene file per observed scene disposition; preserve exact source headings, location captions, source order and page anchors; assemble cross-page scenes without duplicate ownership; keep `★` separators structural; do not create scenes from PDF 4–5 or PDF 88–90; and run whole-work boundary-ownership QA proving 0 gaps / 0 overlaps before closing the scene gate. Commit/push the scene layer, then synchronize work-local and repository-wide mirrors.**'
          new='> **Build the dialogue-index preflight from all 72 complete-verified scene derivatives. Inventory exact source speaker labels and source delimiters without alias normalization; map every candidate to its source scene and PDF/printed-page provenance; flag anomalous delimiters, ordinary unlabelled blocks and cross-page continuation candidates for explicit review; and lock the immutable-dialogue extraction policy only after the preflight is review-ready. Do not alter closed canonical Tamil or scene text.**'
          t=must_replace(t, old, new, 'handover next action'); p.write_text(t, encoding='utf-8')

          # Next-chat prompt: replace entire current derivative prompt with concise dialogue-preflight prompt.
          next_prompt = '''# Next Chat Prompt — வண்டிக்காரன் மகன் / dialogue-index preflight

Continue directly in `pugazg/kalaignar-cinema-works`, branch `main`, active work `works/vandikkaran-magan/`. **LIVE MAIN IS AUTHORITATIVE.**

## Controlling source

`TVA_BOK_0062961_வண்டிக்காரன்_மகன்.pdf` — 90 PDF pages, 26,391,039 bytes, SHA-256 `03579030ad0a082062d907c1ac12cb4eb497a261836d676a8fa46cd5c0c86253`, image-only first edition 1978. Source pixels remain canonical authority.

## Closed upstream gates

- canonical Tamil: **87/87 COMPLETE-VERIFIED — PDF 4–90**;
- historical-glyph gate: **87/87 COMPLETE / 0 holds**;
- final full visual pass: **87/87 PASS / 0 final corrections**;
- source-visible scene headings: **72**, including `4-எ` at PDF 10 and `53-டி` at PDF 83;
- scene derivatives: **72/72 COMPLETE-VERIFIED**;
- scene boundary ownership QA: **PASS — 0 gaps / 0 overlaps / 82/82 screenplay pages represented**;
- canonical scene-body SHA-256 equals joined scene-span SHA-256: `84227c9855f3de942c8f1c240f9e6ddeee2d13f348fdda14b7712a81c4cfc19a`.

Do not reopen closed source or scene layers unless direct contradictory evidence from the controlling scan appears.

## Exact next activity

> **Run the dialogue-index preflight over the closed 72-scene derivative/canonical screenplay layer. Inventory every explicit source speaker-label occurrence and exact delimiter; retain source scene ID plus PDF/printed-page provenance; identify zero-dialogue scenes, non-standard delimiter candidates, ordinary unlabelled blocks and possible cross-page utterance continuations; exclude headings, location captions, stage directions, separators and metadata from immutable dialogue starts; do not normalize speaker aliases; write durable JSON + Markdown preflight reports; commit/push them; then review every flagged candidate before generating immutable dialogue records.**
'''
          (W/'NEXT_CHAT_PROMPT.md').write_text(next_prompt, encoding='utf-8')

          # Mapping.
          p=W/'mapping.md'; t=p.read_text(encoding='utf-8')
          t=t.replace('Corrective first-pass review established **71 source-visible scene-heading occurrences**.', 'Closed canonical/derivative reconciliation establishes **72 source-visible scene-heading occurrences**. The additional source boundary is `காட்சி — 4 எ.` on PDF 10 / printed p.9.')
          t=t.replace('inserted suffix heading occurrences: **16**;', 'inserted suffix heading occurrences: **17**;')
          t=t.replace('`1, 2, 3, 4, 5, 6,', '`1, 2, 3, 4, 4-எ, 5, 6,')
          t=t.replace('scene-heading inventory: **71/71 observed occurrences mapped**;', 'scene-heading inventory: **72/72 source-visible occurrences mapped**;')
          t=t.replace('- scene-text derivatives: **READY-NEXT**;\n- dialogue / character / song / English / reader layers: **GATED behind scene derivative closure**.', '- scene-text derivatives: **72/72 COMPLETE-VERIFIED — boundary QA PASS / 0 gaps / 0 overlaps**;\n- dialogue index: **READY-NEXT — preflight not started**;\n- character / song / English / reader layers: **GATED behind dialogue/character sequencing**.')
          old='**Build the scene-text derivative layer from verified screenplay PDF 6–87 using all 71 observed source scene dispositions. Preserve exact source headings and page anchors, assemble cross-page scenes without duplicate ownership, keep `★` structural, exclude PDF 4–5 and PDF 88–90 from synthetic scene creation, create the scene index, and run whole-work boundary-ownership QA proving 0 gaps / 0 overlaps before closing the scene layer.**'
          new='**Build the dialogue-index preflight from the complete-verified 72-scene layer. Inventory exact speaker labels/delimiters and source provenance, flag anomalous delimiter/unlabelled/cross-page candidates, and review those candidates before immutable dialogue generation. Do not normalize aliases or alter closed Tamil/scene spans.**'
          t=must_replace(t, old, new, 'mapping next action'); p.write_text(t, encoding='utf-8')

          # Metadata YAML textual sync.
          p=W/'metadata.yaml'; t=p.read_text(encoding='utf-8')
          t=t.replace('observed_scene_heading_occurrences: 71', 'observed_scene_heading_occurrences: 72')
          t=t.replace('suffix_insert_headings: 16', 'suffix_insert_headings: 17')
          t=t.replace('  inserted_suffix_labels:\n    - 10-எ', '  inserted_suffix_labels:\n    - 4-எ\n    - 10-எ')
          t=t.replace('scene_heading_audit: complete-71-of-71-observed', 'scene_heading_audit: complete-72-of-72-observed')
          t=t.replace('scene_text_derivatives: ready-next', 'scene_text_derivatives: complete-verified-72-of-72')
          t=t.replace('dialogue_index: blocked-pending-scene-layer', 'dialogue_index: ready-next-preflight-not-started')
          t=re.sub(r'^next_action: .*$', 'next_action: "Run dialogue-index preflight over all 72 complete-verified source-led scenes; inventory exact speaker labels and delimiters with source provenance; flag anomalous/unlabelled/cross-page candidates; commit review-ready preflight reports; then review flagged candidates before immutable dialogue generation."', t, flags=re.M)
          p.write_text(t, encoding='utf-8')

          # Transcription README downstream note.
          p=W/'transcription/README.md'; t=p.read_text(encoding='utf-8')
          old='Build `../scenes/index.json` and one scene derivative for each of the **71 observed source scene-heading occurrences** using the closed canonical screenplay. Preserve exact headings, source order, page anchors and cross-page continuity; avoid duplicate ownership; keep decorative stars structural; and run boundary-ownership QA proving **0 gaps / 0 overlaps** before the scene layer is closed.'
          new='The scene layer is now **72/72 COMPLETE-VERIFIED** with boundary ownership QA **PASS — 0 gaps / 0 overlaps** across screenplay PDF 6–87. The next structured phase is the dialogue-index preflight: inventory exact source speaker labels/delimiters and source provenance, review anomalous/unlabelled/cross-page candidates, and only then generate immutable dialogue records.'
          t=must_replace(t, old, new, 'transcription README next'); p.write_text(t, encoding='utf-8')

          # Root README: replace active work section only.
          p=Path('README.md'); t=p.read_text(encoding='utf-8')
          section='''## வண்டிக்காரன் மகன் status

`TVA_BOK_0062961_வண்டிக்காரன்_மகன்.pdf` is the active cinema-work source.

- source: **90 PDF pages / 26,391,039 bytes / SHA-256 `03579030ad0a082062d907c1ac12cb4eb497a261836d676a8fa46cd5c0c86253`**;
- canonical Tamil: **87/87 COMPLETE-VERIFIED — PDF 4–90 / 0 open uncertainty markers**;
- historical-glyph / final visual gates: **87/87 COMPLETE / 87/87 PASS**;
- source-visible scene headings: **72**, including late-reconciled `4-எ` at PDF 10 and `53-டி` at PDF 83;
- scene-text derivatives: **72/72 COMPLETE-VERIFIED**;
- boundary ownership QA: **PASS — 0 gaps / 0 overlaps / 82/82 screenplay pages represented**;
- canonical scene body and joined derivative spans share SHA-256 `84227c9855f3de942c8f1c240f9e6ddeee2d13f348fdda14b7712a81c4cfc19a`;
- dialogue index: **READY-NEXT — preflight not started**;
- character/entity, song/performance, English and reader layers: **BLOCKED by normal downstream sequencing**.

**Next:** Run the dialogue-index preflight across all 72 verified scenes. Preserve exact source speaker labels and delimiters, retain scene/page provenance, identify anomalous delimiter/unlabelled/cross-page candidates for review, and do not normalize aliases or alter closed source/scene text.
'''
          nt, n = re.subn(r'(?s)## வண்டிக்காரன் மகன் status\n.*?(?=\n## நாம் status)', section.rstrip()+"\n", t)
          if n != 1: raise SystemExit(f'root README Vandikkaran section replacements={n}')
          p.write_text(nt, encoding='utf-8')

          # Master handover high-level active checkpoint.
          p=Path('docs/HANDOVER_KALAIGNAR_CINEMA_WORKS.md'); t=p.read_text(encoding='utf-8')
          t, n = re.subn(r'^- \*\*Vandikkaran Magan / வண்டிக்காரன் மகன்\*\* — .*$', '- **Vandikkaran Magan / வண்டிக்காரன் மகன்** — canonical Tamil **87/87 complete-verified**; source-visible scene headings **72**; scene derivatives **72/72 complete-verified**; boundary ownership QA **PASS — 0 gaps / 0 overlaps / 82/82 screenplay pages**; dialogue-index preflight **READY-NEXT**.', t, flags=re.M)
          if n != 1: raise SystemExit(f'master handover bullet replacements={n}')
          t=re.sub(r'Ammayappan remains closed at its complete-verified checkpoint\. \*\*Naam / நாம் is closed through reader/export and Reading Room payload QA PASS\. The current active production work is வண்டிக்காரன் மகன், whose source intake and structural-mapping gate are now complete-verified; canonical Tamil is next\.\*\*', 'Ammayappan remains closed at its complete-verified checkpoint. **Naam / நாம் is closed through reader/export and Reading Room payload QA PASS. The current active production work is வண்டிக்காரன் மகன்: canonical Tamil and the 72-scene derivative layer are closed; dialogue-index preflight is next.**', t)
          p.write_text(t, encoding='utf-8')

          # Status consistency audit matrix + current note.
          p=Path('docs/STATUS_CONSISTENCY_AUDIT.md'); t=p.read_text(encoding='utf-8')
          t, n = re.subn(r'^\| Vandikkaran Magan / வண்டிக்காரன் மகன் \|.*$', '| Vandikkaran Magan / வண்டிக்காரன் மகன் | canonical Tamil **87/87 COMPLETE-VERIFIED**; glyph/final visual gates PASS | **72/72 scenes COMPLETE-VERIFIED; boundary QA PASS** | dialogue index READY-NEXT | not-started |', t, flags=re.M)
          if n != 1: raise SystemExit(f'status matrix replacements={n}')
          marker='## Repository-wide synchronization rule'
          if '## Vandikkaran Magan current checkpoint' not in t:
              block='''## Vandikkaran Magan current checkpoint

- canonical Tamil: **87/87 COMPLETE-VERIFIED — PDF 4–90**;
- source-visible scene headings: **72**; late structural correction adds `4-எ` at PDF 10 / printed p.9;
- scene derivatives: **72/72 COMPLETE-VERIFIED**;
- boundary ownership QA: **PASS — 0 gaps / 0 overlaps / 82/82 screenplay pages represented**;
- canonical/joined scene-body SHA-256: `84227c9855f3de942c8f1c240f9e6ddeee2d13f348fdda14b7712a81c4cfc19a`;
- dialogue index: **READY-NEXT — preflight not started**.

**Next production phase:** build and review the dialogue-index preflight; preserve exact source speaker labels/delimiters and page provenance; do not normalize aliases or modify closed Tamil/scene layers.

'''
              if marker not in t: raise SystemExit('status audit marker missing')
              t=t.replace(marker, block+marker)
          p.write_text(t, encoding='utf-8')

          # Machine-readable registry.
          p=Path('data/works.json'); data=json.loads(p.read_text(encoding='utf-8'))
          rows=[x for x in data if x.get('id')=='vandikkaran-magan']
          if len(rows)!=1: raise SystemExit(f'vandikkaran-magan registry rows={len(rows)}')
          x=rows[0]
          x['structural_mapping']='verified'
          x['scene_headings_observed']=72
          x['source_numbered_scene_headings']=True
          x['tamil_transcription']='complete-verified'
          x['tamil_first_pass_complete']=True
          x['tamil_transcription_through_pdf_page']=90
          x['tamil_transcription_through_printed_page']=86
          x['tamil_transcription_draft_pages']=0
          x['tamil_transcription_verified_pages']=87
          x['tamil_transcription_review_pages']=0
          x['tamil_fidelity_audit']='complete'
          x['canonical_range_fidelity_audit_complete']=True
          x['total_canonical_pages']=87
          x['total_verified_pages']=87
          x['total_review_pages']=0
          sd=x.setdefault('structured_derivatives',{})
          sd.update({
              'scene_index':'complete-verified',
              'scene_index_path':'works/vandikkaran-magan/scenes/index.json',
              'scene_records':72,
              'scene_text_derivatives':'complete-verified',
              'scene_text_files_completed':72,
              'boundary_ownership_qa':'PASS',
              'boundary_ownership_qa_path':'works/vandikkaran-magan/notes/scene-boundary-ownership-qa.md',
              'dialogue_index':'ready-next',
              'next_structured_derivative':'dialogue-index-preflight'
          })
          x['next_action']='Run dialogue-index preflight from the 72/72 complete-verified scene layer; inventory exact source speaker labels/delimiters and page provenance; review anomalous/unlabelled/cross-page candidates before immutable dialogue generation.'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
      - name: Commit synchronized scene closure
        shell: bash
        run: |
          rm .github/workflows/vandikkaran-magan-sync-scene-closure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Sync Vandikkaran Magan 72-scene closure [skip ci]"
          git push origin HEAD:main
