name: Vandikkaran Magan repair and build scenes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vandikkaran-magan-debug-scenes.yml"

permissions:
  contents: write

jobs:
  repair-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repair suffix parser
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('works/vandikkaran-magan/scripts/build_scene_derivatives.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          hits = 0
          for i, line in enumerate(lines):
              if 'm = re.fullmatch' in line:
                  lines[i] = '    m = re.fullmatch(r"(\\d+(?:-\\d+)?)(?:[-\\s]+((?:எ|பி|சி|டி)))?", tail)'
                  hits += 1
          if hits != 1:
              raise SystemExit(f'expected one parser line, found {hits}')
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Build source-led scene derivatives
        run: python works/vandikkaran-magan/scripts/build_scene_derivatives.py
      - name: Validate repaired scene layer
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('works/vandikkaran-magan')
          idx = json.loads((root/'scenes/index.json').read_text(encoding='utf-8'))
          assert idx['status'] == 'complete-verified'
          assert idx['total_scenes'] == 72
          assert idx['ordered_scene_ids'][0:6] == ['1','2','3','4','4-எ','5']
          assert idx['ordered_scene_ids'][-5:] == ['53-டி','54','55','56'][-5:] if False else idx['ordered_scene_ids'][-4:]
          assert idx['ordered_scene_ids'][-4:] == ['53-டி','54','55','56']
          assert idx['canonical_scene_body_sha256'] == idx['joined_scene_spans_sha256']
          assert idx['qa']['gaps'] == 0 and idx['qa']['overlaps'] == 0
          assert idx['qa']['screenplay_pdf_coverage'] == '82/82 — PDF 6–87'
          assert len(list((root/'scenes').glob('scene-*.md'))) == 72
          qa = (root/'notes/scene-boundary-ownership-qa.md').read_text(encoding='utf-8')
          assert 'Status: **PASS**' in qa
          assert 'காட்சி — 4 எ.' in qa
          print('REPAIRED SCENE DERIVATIVE QA PASS: 72/72')
          PY
          git diff --check
      - name: Commit repaired verified scene layer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add works/vandikkaran-magan/scripts/build_scene_derivatives.py
          git add works/vandikkaran-magan/scenes works/vandikkaran-magan/notes/scene-boundary-ownership-qa.md
          git commit -m "Build Vandikkaran Magan 72 verified scene derivatives [skip ci]"
          git push origin HEAD:main
