name: Vandikkaran Magan character closure sync once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/vm-sync-character-closure-once.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize character closure
        run: python works/vandikkaran-magan/scripts/sync_character_closure.py
      - name: Verify closed source content unchanged
        run: |
          git diff --exit-code -- works/vandikkaran-magan/transcription
          git diff --exit-code -- works/vandikkaran-magan/scenes/index.json works/vandikkaran-magan/scenes/scene-*.md
          git diff --exit-code -- works/vandikkaran-magan/dialogues/index.json works/vandikkaran-magan/dialogues/schema.json works/vandikkaran-magan/dialogues/records
      - name: Commit synchronized checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/vm-sync-character-closure-once.yml
          git add -A
          git commit -m 'Synchronize Vandikkaran Magan character closure [skip ci]'
          git push
# retry: status/readme mirrors may change, closed source content may not
