name: One-off Ammayappan fidelity PDF 25-34

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ammaiyappan-fidelity-025-034.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply PDF 25-34 fidelity corrections
        run: |
          sed -i "/assert 'வரையில் நாளுக்கு ஒரு அதிகாரம் ஆளுக்கு ஒரு நாட்/d" .github/scripts/ammaiyappan_fidelity_025_034.py
          python .github/scripts/ammaiyappan_fidelity_025_034.py
      - name: Commit synchronized checkpoint and remove one-off files
        run: |
          rm -f .github/scripts/ammaiyappan_fidelity_025_034.py
          rm -f .github/workflows/ammaiyappan-fidelity-025-034.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Verify Ammayappan PDF 25-34 fidelity'
          git push origin HEAD:main
