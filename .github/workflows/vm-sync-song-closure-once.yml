name: Vandikkaran Magan song closure sync once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/vm-sync-song-closure-once.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize song/performance closure
        run: python works/vandikkaran-magan/scripts/sync_song_performance_closure.py
      - name: Commit synchronized checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/vm-sync-song-closure-once.yml
          git add -A
          git commit -m 'Synchronize Vandikkaran Magan song performance closure [skip ci]'
          git push
