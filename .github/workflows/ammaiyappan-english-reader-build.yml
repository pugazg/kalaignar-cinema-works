name: Ammayappan English reader QA and build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "works/ammaiyappan/translations/index.json"
      - "works/ammaiyappan/translations/records/**"
      - "works/ammaiyappan/dialogues/records/**"
      - "works/ammaiyappan/dialogues/source-role-resolved-records.json"
      - "works/ammaiyappan/songs/inventory.json"
      - "works/ammaiyappan/editions/en/audit_probe.py"
      - "works/ammaiyappan/editions/en/build.py"
      - "works/ammaiyappan/editions/en/sync_status.py"
      - ".github/workflows/ammaiyappan-english-reader-build.yml"

permissions:
  contents: write

jobs:
  reader-qa-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Re-run whole-work English reader preflight
        run: python works/ammaiyappan/editions/en/audit_probe.py

      - name: Build and validate deterministic reader exports
        run: python works/ammaiyappan/editions/en/build.py

      - name: Synchronize completed reader/export status
        run: python works/ammaiyappan/editions/en/sync_status.py

      - name: Commit generated reader package and synchronized status
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            data/works.json \
            docs/HANDOVER_KALAIGNAR_CINEMA_WORKS.md \
            docs/STATUS_CONSISTENCY_AUDIT.md \
            works/ammaiyappan/README.md \
            works/ammaiyappan/PROJECT_HANDOVER.md \
            works/ammaiyappan/NEXT_CHAT_PROMPT.md \
            works/ammaiyappan/metadata.yaml \
            works/ammaiyappan/translations/README.md \
            works/ammaiyappan/translations/index.json \
            works/ammaiyappan/editions/en/reader-edition.md \
            works/ammaiyappan/editions/en/reader-edition.html \
            works/ammaiyappan/editions/en/reader-edition.json \
            works/ammaiyappan/editions/en/QA_REPORT.md \
            works/ammaiyappan/editions/en/manifest.json
          if git diff --cached --quiet; then
            echo "Reader exports and status are already reproducible; nothing to commit."
          else
            git commit -m "Build Ammayappan English reader package [skip ci]"
            git push
          fi
