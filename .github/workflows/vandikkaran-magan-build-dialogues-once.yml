name: Vandikkaran Magan build dialogues once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vandikkaran-magan-build-dialogues-once.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and verify immutable dialogue layer
        run: python works/vandikkaran-magan/scripts/build_dialogues.py
      - name: Commit verified dialogue layer
        shell: bash
        run: |
          rm .github/workflows/vandikkaran-magan-build-dialogues-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Build Vandikkaran Magan 744 verified dialogues [skip ci]"
          git push origin HEAD:main
