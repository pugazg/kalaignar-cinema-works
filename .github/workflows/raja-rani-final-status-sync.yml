name: Raja Rani final repository status sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/raja-rani-final-status-sync.yml"
      - "works/raja-rani/integrations/reading-room/sync_status.py"

permissions:
  contents: write

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Narrow Raja Rani registry stale assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("works/raja-rani/integrations/reading-room/sync_status.py")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r'    for path in current_paths:\n'
              r'        text = read\(path\)\n'
              r'        for needle in forbidden:\n'
              r'            if needle in text:\n'
              r'                raise RuntimeError\(f"stale current-state phrase remains in \{path\.relative_to\(ROOT\)\}: \{needle\}"\)\n'
          )
          new = '''    registry_path = ROOT / "data" / "works.json"
              registry = json.loads(read(registry_path))
              matches = [work for work in registry if work.get("id") == "raja-rani"]
              if len(matches) != 1:
                  raise RuntimeError("data/works.json must contain exactly one raja-rani entry during stale assertion")
              raja_rani_text = json.dumps(matches[0], ensure_ascii=False)
              registry_forbidden = [
                  '"reader_export": "not-started"',
                  '"reading_room_integration": "not-started"',
              ]
              for needle in registry_forbidden:
                  if needle in raja_rani_text:
                      raise RuntimeError(f"stale Raja Rani registry state remains: {needle}")

              non_registry_forbidden = [needle for needle in forbidden if needle not in registry_forbidden]
              for current_path in current_paths:
                  if current_path == registry_path:
                      continue
                  current_text = read(current_path)
                  for needle in non_registry_forbidden:
                      if needle in current_text:
                          raise RuntimeError(
                              f"stale current-state phrase remains in {current_path.relative_to(ROOT)}: {needle}"
                          )
          '''
          text, count = pattern.subn(new, text, count=1)
          if count != 1:
              raise SystemExit(f"expected one stale_assertions loop, found {count}")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Synchronize Raja Rani current status surfaces
        run: python works/raja-rani/integrations/reading-room/sync_status.py

      - name: Verify changes stay inside this repository
        shell: bash
        run: |
          test "$(git remote get-url origin)" = "https://github.com/pugazg/kalaignar-cinema-works"
          git status --short

      - name: Commit synchronized status to this repository only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Raja Rani status is already synchronized; nothing to commit."
          else
            git commit -m "Synchronize Raja Rani completed repository status [skip ci]"
            git push origin HEAD:main
          fi
