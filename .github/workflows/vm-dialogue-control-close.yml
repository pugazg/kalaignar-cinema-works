name: Close Vandikkaran Magan dialogue controls
on:
  push:
    branches: [main]
    paths: ['.github/workflows/vm-dialogue-control-close.yml']
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python works/vandikkaran-magan/scripts/finalize_dialogue_controls.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/vm-dialogue-control-close.yml
          git add -A
          git commit -m 'Close Vandikkaran Magan dialogue review controls [skip ci]'
          git push
