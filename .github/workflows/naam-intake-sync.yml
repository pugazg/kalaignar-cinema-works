name: Naam intake synchronization

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "works/naam/README.md"
      - "works/naam/metadata.yaml"
      - "works/naam/mapping.md"
      - "works/naam/notes/historical-glyph-audit.md"
      - "works/naam/PROJECT_HANDOVER.md"
      - "works/naam/NEXT_CHAT_PROMPT.md"
      - "works/naam/scripts/sync_intake.py"
      - ".github/workflows/naam-intake-sync.yml"

permissions:
  contents: write

jobs:
  intake-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronize Naam intake mirrors
        run: python works/naam/scripts/sync_intake.py

      - name: Validate registry JSON
        run: python -m json.tool data/works.json >/dev/null

      - name: Commit synchronized intake checkpoint
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/works.json \
            README.md \
            docs/HANDOVER_KALAIGNAR_CINEMA_WORKS.md \
            docs/STATUS_CONSISTENCY_AUDIT.md
          if git diff --cached --quiet; then
            echo "Naam intake mirrors are already synchronized; nothing to commit."
          else
            git commit -m "Synchronize Naam intake and structural map [skip ci]"
            git push
          fi
