name: Ammayappan historical glyph synchronization

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ammaiyappan-historical-glyph-sync.yml"
      - "works/ammaiyappan/scripts/apply_historical_glyph_sync.py"
      - "works/ammaiyappan/notes/historical-glyph-sync-manifest.json"

permissions:
  contents: write

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply page-scoped historical-glyph manifest
        run: python works/ammaiyappan/scripts/apply_historical_glyph_sync.py

      - name: Verify change scope
        shell: bash
        run: |
          test "$(git remote get-url origin)" = "https://github.com/pugazg/kalaignar-cinema-works"
          git status --short
          python - <<'PY'
          import subprocess
          allowed = {
              'works/ammaiyappan/transcription/full-text.md',
              'works/ammaiyappan/transcription/parts/pdf-015-024.md',
              'works/ammaiyappan/transcription/parts/pdf-025-034.md',
              'works/ammaiyappan/transcription/parts/pdf-035-044.md',
              'works/ammaiyappan/transcription/parts/pdf-045-054.md',
              'works/ammaiyappan/transcription/parts/pdf-055-064.md',
              'works/ammaiyappan/transcription/parts/pdf-065-074.md',
              'works/ammaiyappan/notes/historical-glyph-sync-report.json',
          }
          changed = {
              line[3:] for line in subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
              if line.strip()
          }
          extra = changed - allowed
          if extra:
              raise SystemExit(f'unexpected changed paths: {sorted(extra)}')
          PY

      - name: Commit synchronized text
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            works/ammaiyappan/transcription/full-text.md \
            works/ammaiyappan/transcription/parts/pdf-015-024.md \
            works/ammaiyappan/transcription/parts/pdf-025-034.md \
            works/ammaiyappan/transcription/parts/pdf-035-044.md \
            works/ammaiyappan/transcription/parts/pdf-045-054.md \
            works/ammaiyappan/transcription/parts/pdf-055-064.md \
            works/ammaiyappan/transcription/parts/pdf-065-074.md \
            works/ammaiyappan/notes/historical-glyph-sync-report.json
          if git diff --cached --quiet; then
            echo "Ammayappan historical-glyph synchronization already clean."
          else
            git commit -m "Synchronize Ammayappan historical glyph readings [skip ci]"
            git push origin HEAD:main
          fi
