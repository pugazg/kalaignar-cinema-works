name: Vandikkaran Magan English source pack 41-60 once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/vm-translation-sourcepack-041-060-once.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build compact source pack
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          W=Path('works/vandikkaran-magan'); S=W/'scenes'; D=W/'dialogues'/'records'
          out=[]; total=0
          for n in range(41,61):
              rows=json.loads((D/f'scene-{n:03d}.json').read_text(encoding='utf-8'))
              total += len(rows)
              out.append(f'=== SCENE {n:03d} DIALOGUES {len(rows)} ===')
              for r in rows:
                  out.append('D\t'+r['id']+'\t'+r['speaker_label']+'\t'+json.dumps(r['text'],ensure_ascii=False))
              text=(S/f'scene-{n:03d}.md').read_text(encoding='utf-8')
              blocks=[b.strip() for b in re.split(r'\n[ \t]*\n',text) if b.strip()]
              out.append(f'=== SCENE {n:03d} SOURCE BLOCKS ===')
              for b in blocks:
                  if b.startswith('<!-- derivative provenance:') or b.startswith('## ') or b=='★': continue
                  out.append('B\t'+json.dumps(b,ensure_ascii=False))
          out.insert(0, f'=== BATCH 041-060 TOTAL DIALOGUES {total} ===')
          p=Path('.github/data/vm_translation_sourcepack_041_060.txt'); p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Commit source pack
        run: |
          rm .github/workflows/vm-translation-sourcepack-041-060-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Prepare Vandikkaran Magan English source pack 41-60 [skip ci]'
          git push origin main
