name: One-off Ammayappan first-pass assembly

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ammaiyappan-first-pass-assemble.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble continuous first-pass transcription and run boundary QA
        shell: bash
        run: |
          set -euo pipefail
          base='works/ammaiyappan/transcription'
          tmp="$(mktemp)"

          cat "$base/full-text.md" > "$tmp"

          parts=(
            pdf-015-024.md
            pdf-025-034.md
            pdf-035-044.md
            pdf-045-054.md
            pdf-055-064.md
            pdf-065-074.md
            pdf-075-084.md
            pdf-085-094.md
            pdf-095-104.md
            pdf-105-109.md
          )

          for part in "${parts[@]}"; do
            printf '\n\n' >> "$tmp"
            awk 'BEGIN{copy=0} /^<!-- source: pdf=/{copy=1} copy{print}' "$base/parts/$part" >> "$tmp"
          done

          mv "$tmp" "$base/full-text.md"

          python - <<'PY'
          import re
          from pathlib import Path

          base = Path('works/ammaiyappan/transcription')
          path = base / 'full-text.md'
          text = path.read_text(encoding='utf-8')

          anchors = [int(x) for x in re.findall(r'<!-- source: pdf=(\d+)', text)]
          expected = list(range(5, 110))
          if anchors != expected:
              from collections import Counter
              c = Counter(anchors)
              missing = [p for p in expected if c[p] == 0]
              duplicate = [p for p, n in sorted(c.items()) if n > 1]
              raise SystemExit(f'anchor QA failed: count={len(anchors)} missing={missing} duplicate={duplicate} first={anchors[:5]} last={anchors[-5:]}')

          if '## தூக்குமேடை' not in text:
              raise SystemExit('locked heading QA failed: தூக்குமேடை missing')
          if '## தாக்குமேடை' in text:
              raise SystemExit('locked heading QA failed: rejected தாக்குமேடை present')

          # Every bounded part must have contributed its first and last source anchors.
          ranges = [(15,24),(25,34),(35,44),(45,54),(55,64),(65,74),(75,84),(85,94),(95,104),(105,109)]
          for a,b in ranges:
              if f'<!-- source: pdf={a}' not in text or f'<!-- source: pdf={b}' not in text:
                  raise SystemExit(f'boundary QA failed for part {a}-{b}')

          uncertainty_spans = text.count('⟦')
          report = f'''# Ammayappan first-pass assembly QA\n\n- assembled canonical range: **PDF 5–109 / 105 pages**\n- source anchors found: **{len(anchors)}**\n- anchor order: **PASS — exact sequence 5 through 109**\n- missing anchors: **0**\n- duplicate anchors: **0**\n- bounded-part boundary presence: **PASS**\n- locked PDF 107 heading `தூக்குமேடை`: **PASS**\n- rejected `தாக்குமேடை` present: **no**\n- visible unresolved first-pass spans in assembled text: **{uncertainty_spans}**\n- assembly method: retained the existing PDF 5–14 `full-text.md`, then appended each bounded part from its first `<!-- source: pdf=... -->` anchor, dropping only batch-level wrapper metadata.\n\nThis QA closes **first-pass assembly only**. It does not constitute the separate rendered-scan visual fidelity audit and does not upgrade any page to verified Tamil.\n'''
          (base / 'ASSEMBLY_QA.md').write_text(report, encoding='utf-8')
          PY

          rm '.github/workflows/ammaiyappan-first-pass-assemble.yml'

      - name: Commit assembled transcription
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Assemble Ammayappan complete first-pass transcription'
          git push origin HEAD:main
