name: Ammayappan English reader preflight

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "works/ammaiyappan/translations/index.json"
      - "works/ammaiyappan/translations/records/**"
      - "works/ammaiyappan/dialogues/records/**"
      - "works/ammaiyappan/dialogues/source-role-resolved-records.json"
      - "works/ammaiyappan/songs/inventory.json"
      - "works/ammaiyappan/editions/en/audit_probe.py"
      - "works/ammaiyappan/editions/en/sync_preflight_status.py"
      - ".github/workflows/ammaiyappan-english-reader-preflight.yml"

permissions:
  contents: write

jobs:
  reader-preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run whole-work English reader/export preflight
        run: python works/ammaiyappan/editions/en/audit_probe.py

      - name: Record PASS and synchronize active status mirrors
        run: python works/ammaiyappan/editions/en/sync_preflight_status.py

      - name: Commit preflight report and synchronized status
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            data/works.json \
            docs/HANDOVER_KALAIGNAR_CINEMA_WORKS.md \
            docs/STATUS_CONSISTENCY_AUDIT.md \
            works/ammaiyappan/README.md \
            works/ammaiyappan/PROJECT_HANDOVER.md \
            works/ammaiyappan/NEXT_CHAT_PROMPT.md \
            works/ammaiyappan/metadata.yaml \
            works/ammaiyappan/translations/README.md \
            works/ammaiyappan/editions/en/PREFLIGHT_QA_REPORT.md
          if git diff --cached --quiet; then
            echo "Preflight status is already synchronized; nothing to commit."
          else
            git commit -m "Record Ammayappan English reader preflight PASS [skip ci]"
            git push
          fi
