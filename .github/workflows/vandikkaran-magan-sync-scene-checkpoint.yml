name: Vandikkaran Magan synchronize scene checkpoint

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vandikkaran-magan-sync-scene-checkpoint.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synchronize checkpoint
        run: python works/vandikkaran-magan/scripts/sync_scene_checkpoint.py
      - name: Verify diffs
        run: git diff --check
      - name: Commit synchronized checkpoint
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/vandikkaran-magan-sync-scene-checkpoint.yml
          git rm works/vandikkaran-magan/scripts/sync_scene_checkpoint.py
          git add works/vandikkaran-magan data/works.json README.md docs/HANDOVER_KALAIGNAR_CINEMA_WORKS.md docs/STATUS_CONSISTENCY_AUDIT.md
          git commit -m "Sync Vandikkaran Magan 72-scene checkpoint [skip ci]"
          git push origin HEAD:main
