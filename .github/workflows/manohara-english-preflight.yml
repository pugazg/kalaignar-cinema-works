name: Manohara English reader preflight

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "works/manohara/translations/index.json"
      - "works/manohara/translations/records/**"
      - "works/manohara/dialogues/records/**"
      - "works/manohara/songs/inventory.json"
      - "works/manohara/scenes/**"
      - "works/manohara/editions/en/audit_probe.py"
      - "works/manohara/editions/en/sync_preflight_status.py"
      - ".github/workflows/manohara-english-preflight.yml"

permissions:
  contents: write

jobs:
  reader-preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run whole-work English reader preflight
        run: python works/manohara/editions/en/audit_probe.py

      - name: Synchronize preflight checkpoint metadata
        run: python works/manohara/editions/en/sync_preflight_status.py

      - name: Commit synchronized checkpoint
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            works/manohara/README.md \
            works/manohara/metadata.yaml \
            works/manohara/translations/README.md
          if git diff --cached --quiet; then
            echo "Preflight checkpoint metadata is already synchronized; nothing to commit."
          else
            git commit -m "Sync Manohara reader preflight checkpoint [skip ci]"
            git push
          fi
