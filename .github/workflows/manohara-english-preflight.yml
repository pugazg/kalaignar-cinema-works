name: Manohara English reader QA and build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "works/manohara/translations/index.json"
      - "works/manohara/translations/records/**"
      - "works/manohara/dialogues/records/**"
      - "works/manohara/songs/inventory.json"
      - "works/manohara/scenes/**"
      - "works/manohara/editions/en/audit_probe.py"
      - "works/manohara/editions/en/build.py"
      - "works/manohara/editions/en/sync_preflight_status.py"
      - "works/manohara/editions/en/sync_status.py"
      - ".github/workflows/manohara-english-preflight.yml"

permissions:
  contents: write

jobs:
  reader-qa-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run whole-work English reader preflight
        run: python works/manohara/editions/en/audit_probe.py

      - name: Build and validate deterministic reader exports
        run: python works/manohara/editions/en/build.py

      - name: Synchronize completed reader/export status
        run: python works/manohara/editions/en/sync_status.py

      - name: Commit generated reader package and synchronized status
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            works/manohara/README.md \
            works/manohara/metadata.yaml \
            works/manohara/translations/README.md \
            works/manohara/editions/en/reader-edition.md \
            works/manohara/editions/en/reader-edition.html \
            works/manohara/editions/en/reader-edition.json \
            works/manohara/editions/en/QA_REPORT.md \
            works/manohara/editions/en/manifest.json
          if git diff --cached --quiet; then
            echo "Reader exports and status are already reproducible; nothing to commit."
          else
            git commit -m "Build Manohara English reader package [skip ci]"
            git push
          fi
