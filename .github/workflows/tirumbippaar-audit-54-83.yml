name: Tirumbippaar fidelity audit PDF 54-83

on:
  push:
    branches:
      - main
    paths:
      - "tools/apply_tirumbippaar_audit_54_83.py"
      - ".github/workflows/tirumbippaar-audit-54-83.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Account for missing PDF 80 first-pass page anchor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          helper=Path('tools/apply_tirumbippaar_audit_54_83.py')
          s=helper.read_text(encoding='utf-8')
          old="""for p in range(64,84):
              printed=p-8
              t=replace_required(t, f'<!-- source: pdf={p} printed={printed} status=draft -->', f'<!-- source: pdf={p} printed={printed} status=verified -->', f'part04 anchor {p}')
          """
          new="""for p in list(range(64,80)) + list(range(81,84)):
              printed=p-8
              t=replace_required(t, f'<!-- source: pdf={p} printed={printed} status=draft -->', f'<!-- source: pdf={p} printed={printed} status=verified -->', f'part04 anchor {p}')
          """
          if old not in s:
              raise SystemExit('Expected anchor loop not found in helper')
          helper.write_text(s.replace(old,new,1),encoding='utf-8')

          part=Path('works/tirumbippaar/transcription/parts/part-04-pdf-64-91.md')
          t=part.read_text(encoding='utf-8')
          old_boundary='இருந்தாலும் சில தொழிலாளிங்க கொஞ்சம் கொஞ்சமா அந்தப் பாண்டியன் கட்சியிலே சேர்ந்துகிட்டு,'
          new_boundary='இருந்தாலும் சில தொழிலாளிங்க கொஞ்சங்\n\n<!-- source: pdf=80 printed=72 status=verified -->\n\nகொஞ்சமா அந்தப் பாண்டியன் கட்சியிலே சேர்ந்துகிட்டு,'
          if old_boundary not in t:
              raise SystemExit('Expected PDF 79/80 cross-page sentence not found')
          part.write_text(t.replace(old_boundary,new_boundary,1),encoding='utf-8')
          PY

      - name: Apply verified source corrections and status updates
        run: python tools/apply_tirumbippaar_audit_54_83.py

      - name: Commit audit results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/works.json works/tirumbippaar
          if git diff --cached --quiet; then
            echo "Audit outputs are already applied; nothing to commit."
          else
            git commit -m "Verify Tirumbippaar PDF 54-83 against scan [skip ci]"
            git push
          fi
