name: Vandikkaran Magan Reading Room payload once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/vm-reading-room-payload-once.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build and QA Reading Room payload
        run: python works/vandikkaran-magan/integrations/reading-room/build.py
      - name: Synchronize repository status
        run: python works/vandikkaran-magan/integrations/reading-room/sync_status.py
      - name: Verify payload and synchronization gates
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('.')
          out=root/'works/vandikkaran-magan/integrations/reading-room'
          payload=json.loads((out/'reading-room.json').read_text(encoding='utf-8'))
          manifest=json.loads((out/'manifest.json').read_text(encoding='utf-8'))
          assert payload['integration_status']=='payload-complete-verified'
          assert payload['site_application_status']=='not-applied'
          assert payload['work']['counts']['screenplay_scenes']==72
          assert payload['work']['counts']['english_units']==1181
          assert payload['work']['counts']['immutable_dialogue_links']==773
          assert payload['work']['counts']['source_unlabelled_spoken_units']==27
          assert payload['work']['counts']['cross_page_units']==58
          assert payload['work']['counts']['performance_occurrence_identities']==9
          assert payload['work']['counts']['performance_linked_units']==66
          assert len(payload['screenplay_scenes'])==72
          assert len(payload['performance_occurrences'])==9
          assert manifest['status']=='PASS'
          assert manifest['site_application_status']=='not-applied'
          assert (out/'QA_REPORT.md').exists() and '**Status:** PASS' in (out/'QA_REPORT.md').read_text(encoding='utf-8')
          assert 'payload-complete-verified' in (root/'works/vandikkaran-magan/metadata.yaml').read_text(encoding='utf-8')
          assert 'PAYLOAD-COMPLETE-VERIFIED / QA PASS' in (root/'works/vandikkaran-magan/README.md').read_text(encoding='utf-8')
          registry=json.loads((root/'data/works.json').read_text(encoding='utf-8'))
          vm=next(x for x in registry if x.get('id')=='vandikkaran-magan')
          sd=vm['structured_derivatives']
          assert sd['reading_room_integration']=='payload-complete-verified'
          assert sd['reading_room_payload_qa']=='PASS'
          assert sd['reading_room_site_application']=='not-applied'
          assert vm['next_action'] is None
          print('Vandikkaran Magan Reading Room post-sync verification: PASS')
          PY
          git diff --check
      - name: Commit verified payload and synchronized checkpoint
        run: |
          rm .github/workflows/vm-reading-room-payload-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Complete Vandikkaran Magan Reading Room payload and sync [skip ci]'
          git push origin main
