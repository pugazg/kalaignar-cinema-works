name: Ammayappan English pilot once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ammaiyappan-english-pilot-once.yml"

permissions:
  contents: write

jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build source-linked English pilot
        run: |
          python works/ammaiyappan/scripts/build_english_translation_pilot.py
      - name: Validate pilot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('works/ammaiyappan')
          t=root/'translations'
          pre=json.loads((t/'preflight.json').read_text(encoding='utf-8'))
          idx=json.loads((t/'index.json').read_text(encoding='utf-8'))
          rec=json.loads((t/'records/scene-001.json').read_text(encoding='utf-8'))
          assert pre['status']=='complete-pass-pilot-unblocked'
          assert pre['pilot']['total_translation_units_expected']==34
          assert idx['status']=='pilot-verified'
          assert idx['scenes_verified']==[1]
          assert idx['translation_units']==34
          assert idx['dialogue_source_records_linked']==31
          assert idx['source_role_supplement_records_linked']==0
          assert idx['translated_song_performance_occurrences']==[]
          assert idx['source_visible_structural_stars_translated']==0
          assert rec['unit_count']==34
          assert [u['id'] for u in rec['units']]==[f'ammaiyappan-en-s001-u{i:03d}' for i in range(1,35)]
          dialogue=[u for u in rec['units'] if u['kind']=='dialogue']
          stage=[u for u in rec['units'] if u['kind']=='stage-direction']
          assert len(dialogue)==31 and len(stage)==3
          assert [u['source']['source_record_id'] for u in dialogue]==[f'ammaiyappan-s001-d{i:03d}' for i in range(1,32)]
          assert len({u['source']['source_record_id'] for u in dialogue})==31
          assert all(u['source']['speaker_label_origin']=='source-explicit-colon' for u in dialogue)
          assert all(u['source']['source_occurrence_id'] is None for u in rec['units'])
          assert all(len(u['source']['page_provenance'])==1 for u in rec['units'])
          assert all(u['status']=='verified' for u in rec['units'])
          assert all(u['translation']['english_text'].strip() for u in rec['units'])
          assert rec['source_scene_number'] is None
          print('AMMAYAPPAN ENGLISH PILOT PASS — 34 UNITS / 31 DIALOGUE LINKS / 3 STAGE DIRECTIONS')
          PY
      - name: Commit pilot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add works/ammaiyappan/translations
          if git diff --cached --quiet; then
            echo "No pilot changes"
          else
            git commit -m "Add verified Ammayappan English pilot scene 1 [skip ci]"
            git push origin HEAD:main
          fi
