name: Tirumbippaar English reader QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "works/tirumbippaar/translations/index.json"
      - "works/tirumbippaar/translations/records/**"
      - "works/tirumbippaar/dialogues/records/**"
      - "works/tirumbippaar/songs/inventory.json"
      - "works/tirumbippaar/scenes/**"
      - "works/tirumbippaar/editions/en/build.py"
      - "works/tirumbippaar/editions/en/audit_probe.py"
      - "works/tirumbippaar/editions/en/normalize_source_order.py"
      - "works/tirumbippaar/editions/en/sync_status.py"
      - "works/tirumbippaar/editions/en/package.py"
      - ".github/workflows/tirumbippaar-english-edition.yml"

permissions:
  contents: write

jobs:
  qa-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Finalize reconciled translation checkpoint
        run: python works/tirumbippaar/editions/en/sync_status.py --prepare-index

      - name: Synchronize immutable dialogue metadata and corrected source order
        run: python works/tirumbippaar/editions/en/normalize_source_order.py

      - name: Migrate reader gates to index-authoritative reconciliation status
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("works/tirumbippaar/editions/en/build.py")
          text = path.read_text(encoding="utf-8")
          stale_scene = '        ensure(record.get("canonical_scene") == scene and record.get("scene_status", record.get("pilot_status")) == "verified", f"Scene {scene} record mismatch")\n'
          new_scene = '        ensure(record.get("canonical_scene") == scene and record.get("scene_status", record.get("pilot_status")) in {"verified", "corrected-source-reconciled"}, f"Scene {scene} record mismatch")\n'
          stale_reconciliation = '        ensure(record.get("reconciliation_status") == "corrected-source-reconciled", f"Scene {scene} reconciliation status mismatch")\n'
          if stale_scene not in text:
              raise SystemExit("Expected legacy per-file scene-status gate was not found")
          if stale_reconciliation not in text:
              raise SystemExit("Expected legacy per-file reconciliation gate was not found")
          text = text.replace(stale_scene, new_scene, 1)
          text = text.replace(stale_reconciliation, "", 1)
          path.write_text(text, encoding="utf-8")
          print("Reader build accepts both historical verified and corrected-source-reconciled scene markers while translations/index.json controls reconciliation coverage")
          PY

      - name: Run reader preflight diagnostics
        run: python works/tirumbippaar/editions/en/audit_probe.py

      - name: Run whole-work QA and build reader derivatives
        run: python works/tirumbippaar/editions/en/build.py

      - name: Build and validate deterministic EPUB 3 package
        run: python works/tirumbippaar/editions/en/package.py

      - name: Synchronize derivative-status metadata
        run: python works/tirumbippaar/editions/en/sync_status.py --metadata

      - name: Commit generated reader package and synchronized metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            works/tirumbippaar/translations/index.json \
            works/tirumbippaar/translations/records \
            works/tirumbippaar/metadata.yaml \
            works/tirumbippaar/editions/en/build.py \
            works/tirumbippaar/editions/en/reader-edition.md \
            works/tirumbippaar/editions/en/reader-edition.html \
            works/tirumbippaar/editions/en/reader-edition.json \
            works/tirumbippaar/editions/en/QA_REPORT.md \
            works/tirumbippaar/editions/en/manifest.json \
            works/tirumbippaar/editions/en/tirumbippaar-en.epub \
            works/tirumbippaar/editions/en/EPUB_QA_REPORT.md \
            works/tirumbippaar/editions/en/package-manifest.json
          if git diff --cached --quiet; then
            echo "Reader derivatives, EPUB package and metadata are already reproducible; nothing to commit."
          else
            git commit -m "Build Tirumbippaar English publication package [skip ci]"
            git push
          fi
