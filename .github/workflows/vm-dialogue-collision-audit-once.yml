name: Vandikkaran Magan dialogue collision audit once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/vm-dialogue-collision-audit-once.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run dialogue structural collision audit
        run: python works/vandikkaran-magan/scripts/audit_dialogue_structural_collision.py
      - name: Commit audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/vm-dialogue-collision-audit-once.yml
          git add -A
          git commit -m 'Audit Vandikkaran Magan dialogue structural collisions [skip ci]'
          git push
