name: One-off Ammayappan fidelity status fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ammaiyappan-fidelity-status-fix.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix stale Ammayappan detail block
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/STATUS_CONSISTENCY_AUDIT.md')
          s = p.read_text(encoding='utf-8')
          repls = [
            ('- rendered-scan fidelity audit: **in-progress — PDF 5–34 / logical pp.3–32 verified**;', '- rendered-scan fidelity audit: **in-progress — PDF 5–44 / logical pp.3–42 verified**;'),
            ('- verified / draft / review pages: **30 / 75 / 0**;', '- verified / draft / review pages: **40 / 65 / 0**;'),
          ]
          for old, new in repls:
              if s.count(old) != 1:
                  raise SystemExit(f'expected one stale status line, found {s.count(old)}: {old}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove one-off workflow
        run: |
          rm -f .github/workflows/ammaiyappan-fidelity-status-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Synchronize Ammayappan 40-of-105 status audit'
          git push origin HEAD:main
