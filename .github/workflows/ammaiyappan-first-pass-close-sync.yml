name: One-off Ammayappan first-pass closure sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ammaiyappan-first-pass-close-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize repository-wide Ammayappan closure mirrors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          def section(text, heading, lines):
              pattern = re.compile(r'(?ms)^' + re.escape(heading) + r'\n.*?(?=^## |\Z)')
              replacement = '\n'.join(lines).rstrip() + '\n\n'
              out, n = pattern.subn(replacement, text, count=1)
              if n != 1:
                  raise RuntimeError(f'{heading}: expected 1 section, found {n}')
              return out

          root_lines = [
              '## அம்மையப்பன் status',
              '',
              '`TVA_BOK_0064230_அம்மையப்பன்.pdf` is an active **111-page image-only screenplay/dialogue booklet** whose canonical Tamil first-pass draft coverage is now complete and assembled.',
              '',
              '- printed title: **`அம்மையப்பன்`**;',
              '- printed credit: **`கதை வசனம்` / `மு. கருணாநிதி`**;',
              '- source SHA-256: `eda6468a57022b418f44851a0013b090469bc6f4be44a682487800658771720d`;',
              '- main screenplay/dialogue: **PDF 5–109 / logical printed pp.3–107 — 105 pages**;',
              '- structural mapping: **verified intake map**;',
              '- source-numbered scenes: **none**;',
              '- locked PDF 56 / printed p.54 heading: **`பழுதார் வீதி`**;',
              '- locked PDF 107 / printed p.105 heading: **`தூக்குமேடை`**; rejected `தாக்குமேடை` absent;',
              '- canonical Tamil first pass: **draft-complete — 105/105 pages**;',
              '- continuous `full-text.md`: **assembled through PDF 109**;',
              '- first-pass assembly QA: **PASS — 105 anchors, exact PDF 5→109 order, 0 missing, 0 duplicate**;',
              '- open first-pass uncertainty markers: **116**;',
              '- verified Tamil pages: **0/105**;',
              '- visual fidelity audit: **not-started**;',
              '- structured derivatives / English / reader: **blocked pending verified Tamil**.',
              '',
              '**Next:** begin the separate rendered-scan visual fidelity audit at **PDF 5 / logical printed p.3**, proceed page-by-page through PDF 109, and adjudicate all **116** explicit uncertainty markers. Do not start scene/dialogue/character derivatives until all 105 canonical pages are verified.'
          ]
          root = Path('README.md')
          root.write_text(section(root.read_text(encoding='utf-8'), '## அம்மையப்பன் status', root_lines), encoding='utf-8')

          works_path = Path('data/works.json')
          works = json.loads(works_path.read_text(encoding='utf-8'))
          matches = [w for w in works if w.get('id') == 'ammaiyappan']
          if len(matches) != 1:
              raise RuntimeError(f'ammaiyappan registry count={len(matches)}')
          w = matches[0]
          w.update({
              'tamil_transcription': 'draft-complete-awaiting-fidelity-audit',
              'tamil_first_pass_complete': True,
              'tamil_transcription_through_pdf_page': 109,
              'tamil_transcription_through_logical_printed_page': 107,
              'tamil_transcription_draft_pages': 105,
              'tamil_transcription_verified_pages': 0,
              'tamil_transcription_review_pages': 0,
              'tamil_fidelity_audit': 'not-started',
              'canonical_range_fidelity_audit_complete': False,
              'total_canonical_pages': 105,
              'total_verified_pages': 0,
              'total_review_pages': 0,
              'open_first_pass_uncertainty_markers': 116,
              'first_pass_assembly': 'complete-pass',
              'first_pass_assembly_path': 'works/ammaiyappan/transcription/full-text.md',
              'first_pass_assembly_qa_path': 'works/ammaiyappan/transcription/ASSEMBLY_QA.md',
              'next_action': 'Begin the separate rendered-scan visual fidelity audit at PDF 5 / logical printed p.3 and continue through PDF 109. Resolve all 116 explicit first-pass uncertainty markers before structured derivatives.'
          })
          w.setdefault('structured_derivatives', {}).update({
              'scene_index': 'blocked-pending-verified-tamil',
              'scene_text_derivatives': 'blocked-pending-verified-tamil',
              'dialogue_index': 'blocked-pending-verified-tamil',
              'character_index': 'blocked',
              'song_authorship_mapping': 'not-started',
              'english_translation': 'blocked',
              'reader_export': 'blocked',
              'reading_room_integration': 'blocked'
          })
          works_path.write_text(json.dumps(works, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          master_path = Path('docs/HANDOVER_KALAIGNAR_CINEMA_WORKS.md')
          master = master_path.read_text(encoding='utf-8')
          master_line = '- **Ammayappan** — 111-page image-only screenplay/dialogue source; source intake and whole-scan mapping complete; canonical Tamil first pass **draft-complete 105/105 across PDF 5–109 / logical pp.3–107**; continuous `full-text.md` assembled through PDF 109; assembly QA **PASS — 105 exact source anchors, 0 missing, 0 duplicate**; **116** explicit unresolved first-pass readings; verified Tamil **0/105**; separate rendered-scan visual fidelity audit is the exact next gate; structured derivatives remain blocked.'
          master, n = re.subn(r'^- \*\*Ammayappan\*\* —.*$', master_line, master, count=1, flags=re.M)
          if n != 1:
              raise RuntimeError(f'master Ammayappan bullet count={n}')
          master_path.write_text(master, encoding='utf-8')

          audit_path = Path('docs/STATUS_CONSISTENCY_AUDIT.md')
          audit = audit_path.read_text(encoding='utf-8')
          audit = section(audit, '## Result', [
              '## Result',
              '',
              '**PASS — current status mirrors synchronized across all seven works at the Ammayappan canonical-Tamil first-pass closure: 105/105 draft pages assembled through PDF 109, assembly QA PASS, 116 open first-pass readings, visual fidelity audit next.**'
          ])
          row = '| Ammayappan | source intake 111/111; structural map verified; Tamil first pass **105/105 draft-complete across PDF 5–109; assembly QA PASS; 116 open markers; 0 verified pages** | scene/dialogue/character blocked pending verified Tamil | blocked | blocked |'
          audit, n = re.subn(r'^\| Ammayappan \|.*$', row, audit, count=1, flags=re.M)
          if n != 1:
              raise RuntimeError(f'audit Ammayappan row count={n}')

          closure_lines = [
              '## Ammayappan canonical-Tamil first-pass closure checkpoint',
              '',
              '- source: `TVA_BOK_0064230_அம்மையப்பன்.pdf`;',
              '- PDF pages: **111**;',
              '- source SHA-256: `eda6468a57022b418f44851a0013b090469bc6f4be44a682487800658771720d`;',
              '- main screenplay/dialogue: **PDF 5–109 / logical printed pp.3–107 — 105 pages**;',
              '- PDF 110–111: advertisement/back matter, excluded from canonical screenplay;',
              '- structural intake map: **verified — 58 heading/transition occurrences / 37 distinct forms**;',
              '- source-numbered scenes: **none**;',
              '- locked PDF 56 / printed p.54: **`பழுதார் வீதி`**;',
              '- locked PDF 107 / printed p.105: **`தூக்குமேடை`**; rejected `தாக்குமேடை` absent;',
              '- canonical Tamil first pass: **draft-complete — 105/105 pages**;',
              '- completed source range: **PDF 5–109 / logical printed pp.3–107**;',
              '- continuous assembled transcription: `works/ammaiyappan/transcription/full-text.md` through **PDF 109**;',
              '- assembly QA: `works/ammaiyappan/transcription/ASSEMBLY_QA.md` — **PASS**;',
              '- source anchors: **105 / exact PDF 5→109 order / 0 missing / 0 duplicate**;',
              '- bounded part boundary presence: **PASS**;',
              '- open first-pass uncertainty markers: **116**;',
              '- draft pages / verified pages: **105 / 0**;',
              '- visual fidelity audit: **not-started**;',
              '- scene / dialogue / character derivatives: **blocked pending verified Tamil**;',
              '- song/performance authorship gate: **not-started**;',
              '- English translation / reader / Reading Room integration: **blocked**.',
              '',
              'The canonical Tamil **first-pass transcription and assembly gate is closed**. This is not a source-fidelity verification. The exact next activity is the separate rendered-scan visual fidelity audit starting at **PDF 5 / logical printed p.3**, proceeding in source order through PDF 109 and adjudicating all **116** explicit uncertainty markers before structured derivatives are unblocked.'
          ]
          audit = section(audit, '## Ammayappan canonical-Tamil first-pass checkpoint', closure_lines)
          audit = section(audit, '## Conclusion', [
              '## Conclusion',
              '',
              'The current **Ammayappan canonical-Tamil first-pass closure is synchronized repository-wide**. Ammayappan has **111/111 source pages inspected**, a verified intake map for the **PDF 5–109 / logical pp.3–107** screenplay body, and **105/105 draft first-pass pages** assembled into one continuous `full-text.md`. Assembly QA is **PASS** with **105 exact page anchors, 0 missing and 0 duplicate**; the locked `பழுதார் வீதி` and `தூக்குமேடை` readings are preserved and rejected `தாக்குமேடை` is absent. There are **116 explicit unresolved first-pass readings** and **0/105 verified pages**. The next repository activity is the separate rendered-scan visual fidelity audit from **PDF 5**, and no structured derivative is unblocked until all 105 canonical pages pass that audit.'
          ])
          audit_path.write_text(audit, encoding='utf-8')

          assert 'draft-complete — 105/105 pages' in root.read_text(encoding='utf-8')
          assert '105/105 draft-complete' in master_path.read_text(encoding='utf-8')
          assert matches[0]['tamil_first_pass_complete'] is True
          assert matches[0]['open_first_pass_uncertainty_markers'] == 116
          PY

          rm '.github/workflows/ammaiyappan-first-pass-close-sync.yml'

      - name: Commit synchronized closure checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Synchronize Ammayappan first-pass closure'
          git push origin HEAD:main
