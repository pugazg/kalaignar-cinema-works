name: Maruthanattu Ilavarasi Tamil T1 PDF 2-6 once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maruthanattu-ilavarasi-t1-002-006-once.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply batch
        run: python works/maruthanattu-ilavarasi/scripts/apply_t1_002_006.py
      - name: Validate and commit
        run: |
          python -m json.tool works/maruthanattu-ilavarasi/transcription/index.json >/dev/null
          python -m json.tool data/works.json >/dev/null
          rm -f .github/workflows/maruthanattu-ilavarasi-intake-once.yml
          rm -f .github/workflows/maruthanattu-ilavarasi-intake-run-once.yml
          rm -f .github/workflows/maruthanattu-ilavarasi-t1-002-006-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Draft Maruthanattu Ilavarasi Tamil PDF 2-6 [skip ci]'
          git push origin main
