name: Vandikkaran Magan dialogue collision reconciliation once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/vm-reconcile-dialogue-collision-once.yml']
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair classifier and reconcile immutable dialogue authority
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('works/vandikkaran-magan/scripts/reconcile_dialogue_structural_collisions.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('            nonlocal active\n', '            global active\n').replace('        nonlocal active\n', '        global active\n')
          s=s.replace("PURE_ACTION_RE = re.compile(r'^(?:\\([^\\n]*\\)|\\[[^\\n]*\\]|\\{[^\\n]*\\})$')", "PURE_ACTION_RE = re.compile(r'^(?:\\([^()\\n]*\\)|\\[[^\\[\\]\\n]*\\]|\\{[^{}\\n]*\\})$')")
          p.write_text(s,encoding='utf-8')
          PY
          python works/vandikkaran-magan/scripts/reconcile_dialogue_structural_collisions.py
      - name: Reconcile character and song builders and downstream layers
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['build_character_preflight.py','build_characters.py','build_song_performance_index.py']:
              p=Path('works/vandikkaran-magan/scripts')/name
              s=p.read_text(encoding='utf-8')
              s=s.replace("assert idx['status'] == 'complete-verified'", "assert idx['status'] in {'complete-verified','complete-verified-reconciled'}")
              s=s.replace('744/744','773/773').replace('== 744','== 773').replace('= 744','= 773').replace("'744 complete-verified immutable records'", "'773 complete-verified reconciled immutable records'").replace('**744 records / 38 exact source speaker labels**','**773 records / 38 exact source speaker labels**').replace('**744/744**','**773/773**').replace('all_744_dialogue_records_mapped_once','all_773_dialogue_records_mapped_once').replace('entity_counts_sum_to_744','entity_counts_sum_to_773').replace("print('PASS: 744/744 dialogue records; 38/38 exact labels inventoried')", "print('PASS: 773/773 dialogue records; 38/38 exact labels inventoried')").replace("print('PASS: character/entity index 38/38 labels, 744/744 records, 32 entities (15 character / 14 role / 3 collective)')", "print('PASS: character/entity index 38/38 labels, 773/773 records, 32 entities (15 character / 14 role / 3 collective)')")
              p.write_text(s,encoding='utf-8')
          PY
          python works/vandikkaran-magan/scripts/build_character_preflight.py
          python works/vandikkaran-magan/scripts/build_characters.py
          python works/vandikkaran-magan/scripts/build_song_performance_index.py
      - name: Commit reconciled source derivatives
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/vm-reconcile-dialogue-collision-once.yml
          git add -A
          git commit -m 'Reconcile Vandikkaran Magan dialogue collision omissions [skip ci]'
          git push
