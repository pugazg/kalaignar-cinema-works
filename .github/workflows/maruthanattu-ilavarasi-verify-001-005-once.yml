name: Maruthanattu Ilavarasi verify logical 1-5 once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maruthanattu-ilavarasi-verify-001-005-once.yml'
permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply independent V1 corrections and provenance remap
        run: python works/maruthanattu-ilavarasi/scripts/verify_batch_001_005.py
      - name: Synchronize controls and QA
        run: python works/maruthanattu-ilavarasi/scripts/verify_batch_001_005_sync.py
      - name: Commit and self-delete
        run: |
          rm .github/workflows/maruthanattu-ilavarasi-verify-001-005-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Verify Maruthanattu Ilavarasi logical pages 1-5 [skip ci]'
          git push origin main
