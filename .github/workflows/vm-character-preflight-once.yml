name: Vandikkaran Magan character preflight once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/vm-character-preflight-once.yml']
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python works/vandikkaran-magan/scripts/build_character_preflight.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/vm-character-preflight-once.yml
          git add -A
          git commit -m 'Build Vandikkaran Magan character label preflight [skip ci]'
          git push
