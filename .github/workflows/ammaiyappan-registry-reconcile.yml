name: One-off Ammayappan registry reconciliation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ammaiyappan-registry-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile duplicate Ammayappan registry status fields
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('data/works.json')
          works = json.loads(p.read_text(encoding='utf-8'))
          matches = [w for w in works if w.get('id') == 'ammaiyappan']
          if len(matches) != 1:
              raise RuntimeError(f'ammaiyappan registry count={len(matches)}')
          w = matches[0]
          w.update({
              'canonical_tamil_transcription': 'draft-complete-awaiting-fidelity-audit',
              'canonical_tamil_first_pass_complete': True,
              'canonical_tamil_first_pass_pages_completed': 105,
              'canonical_tamil_first_pass_pdf_range_completed': '5-109',
              'canonical_tamil_first_pass_printed_range_completed': '3-107',
              'canonical_tamil_draft_pages': 105,
              'canonical_tamil_verified_pages': 0,
              'canonical_tamil_review_pages': 0,
              'canonical_tamil_open_uncertainty_markers': 116,
              'canonical_tamil_full_text_current_through_pdf_page': 109,
              'canonical_tamil_assembly_status': 'complete-pass',
              'canonical_tamil_assembly_qa_path': 'works/ammaiyappan/transcription/ASSEMBLY_QA.md',
              'canonical_tamil_part_files': [
                  'works/ammaiyappan/transcription/parts/pdf-015-024.md',
                  'works/ammaiyappan/transcription/parts/pdf-025-034.md',
                  'works/ammaiyappan/transcription/parts/pdf-035-044.md',
                  'works/ammaiyappan/transcription/parts/pdf-045-054.md',
                  'works/ammaiyappan/transcription/parts/pdf-055-064.md',
                  'works/ammaiyappan/transcription/parts/pdf-065-074.md',
                  'works/ammaiyappan/transcription/parts/pdf-075-084.md',
                  'works/ammaiyappan/transcription/parts/pdf-085-094.md',
                  'works/ammaiyappan/transcription/parts/pdf-095-104.md',
                  'works/ammaiyappan/transcription/parts/pdf-105-109.md'
              ]
          })
          p.write_text(json.dumps(works, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          assert w['canonical_tamil_first_pass_complete'] is True
          assert w['canonical_tamil_first_pass_pages_completed'] == 105
          assert w['canonical_tamil_first_pass_pdf_range_completed'] == '5-109'
          assert w['canonical_tamil_open_uncertainty_markers'] == 116
          assert w['canonical_tamil_full_text_current_through_pdf_page'] == 109
          assert w['tamil_first_pass_complete'] is True
          assert w['open_first_pass_uncertainty_markers'] == 116

          root = Path('README.md').read_text(encoding='utf-8')
          audit = Path('docs/STATUS_CONSISTENCY_AUDIT.md').read_text(encoding='utf-8')
          master = Path('docs/HANDOVER_KALAIGNAR_CINEMA_WORKS.md').read_text(encoding='utf-8')
          assert 'draft-complete — 105/105 pages' in root
          assert '105/105 draft pages assembled through PDF 109' in audit
          assert 'draft-complete 105/105 across PDF 5–109' in master
          PY

          rm -f '.github/workflows/ammaiyappan-registry-reconcile.yml'

      - name: Commit reconciled registry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Reconcile Ammayappan registry after first-pass closure'
          git push origin HEAD:main
