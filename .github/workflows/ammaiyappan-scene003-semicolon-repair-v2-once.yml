name: Ammayappan scene 3 semicolon repair v2 once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ammaiyappan-scene003-semicolon-repair-v2-once.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repair and rebuild dependent derivatives
        run: python works/ammaiyappan/scripts/repair_scene003_semicolon_boundary.py
      - name: Validate corrected graph
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('works/ammaiyappan')
          d=json.loads((r/'dialogues/records/scene-003.json').read_text(encoding='utf-8'))
          assert d[0]['text']=='பூங்காவனம்-பூங்காவனம்.......'
          s=json.loads((r/'dialogues/source-role-resolved-records.json').read_text(encoding='utf-8'))
          z=[x for x in s if x['id']=='ammaiyappan-s003-r001']
          assert len(z)==1 and z[0]['speaker_label']=='பூங்' and z[0]['source_delimiter']==';'
          f=json.loads((r/'dialogues/final-index.json').read_text(encoding='utf-8'))
          assert f['source_role_resolved_dialogue_records']==16
          assert f['total_dialogue_units_for_downstream_indexing']==1025
          c=json.loads((r/'characters/index.json').read_text(encoding='utf-8'))
          assert c['dialogue_records_source']==1025
          assert c['dialogue_unit_coverage']=='1025/1025'
          assert c['remaining_unmapped_records']==0
          p=json.loads((r/'translations/preflight.json').read_text(encoding='utf-8'))
          assert p['authority']['dialogue_final_index'].startswith('1025-')
          e=json.loads((r/'translations/records/scene-001.json').read_text(encoding='utf-8'))
          assert e['unit_count']==34
          print('PASS — scene 3 source speaker boundary restored, 1025/1025 character coverage')
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add works/ammaiyappan
          git commit -m "Restore Ammayappan scene 3 semicolon speaker boundary [skip ci]"
          git push origin HEAD:main
