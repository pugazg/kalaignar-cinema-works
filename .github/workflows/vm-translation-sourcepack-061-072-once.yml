name: Vandikkaran Magan English source pack 61-72 once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/vm-translation-sourcepack-061-072-once.yml']
permissions:
  contents: write
jobs:
  sourcepack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source pack for final English batch
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          W=Path('works/vandikkaran-magan')
          scene_index=json.loads((W/'scenes'/'index.json').read_text(encoding='utf-8'))
          meta={int(x['ordinal']):x for x in scene_index['scenes']}
          inventory=json.loads((W/'songs'/'inventory.json').read_text(encoding='utf-8'))['records']
          out=[]
          total=0
          for n in range(61,73):
              m=meta[n]
              rows=json.loads((W/'dialogues'/'records'/f'scene-{n:03d}.json').read_text(encoding='utf-8'))
              total+=len(rows)
              out.append(f"=== SCENE {n:03d} SOURCE_ID {m['scene_id']} PDF {m['pdf_pages']} DIALOGUES {len(rows)} ===")
              for r in rows:
                  out.append('D\t'+r['id']+'\t'+r['speaker_label']+'\t'+json.dumps(r['text'],ensure_ascii=False))
              text=(W/'scenes'/f'scene-{n:03d}.md').read_text(encoding='utf-8')
              parts=[b.strip() for b in re.split(r'\n[ \t]*\n',text) if b.strip()]
              blocks=[b for b in parts if not b.startswith('<!-- derivative provenance:') and not b.startswith('## ') and b!='★']
              out.append(f'=== SCENE {n:03d} SOURCE BLOCKS ===')
              for b in blocks: out.append('B\t'+json.dumps(b,ensure_ascii=False))
              relevant=[x for x in inventory if x.get('source_scene_id')==m['scene_id']]
              if relevant:
                  out.append(f'=== SCENE {n:03d} PERFORMANCE RECORDS ===')
                  for x in relevant: out.append('P\t'+json.dumps(x,ensure_ascii=False))
          out.insert(0,f'=== BATCH 061-072 TOTAL DIALOGUES {total} ===')
          Path('.github/data').mkdir(parents=True,exist_ok=True)
          Path('.github/data/vm_translation_sourcepack_061_072.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          print('total_dialogues',total)
          PY
      - name: Commit source pack
        run: |
          rm -f .github/workflows/vm-translation-sourcepack-061-072-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Prepare Vandikkaran Magan English source pack 61-72 [skip ci]'
          git push origin main
