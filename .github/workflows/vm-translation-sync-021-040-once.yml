name: Vandikkaran Magan English sync 21-40 once
# retry after broadening stale conclusion synchronization gate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/vm-translation-sync-021-040-once.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair synchronization gate
        run: |
          python works/vandikkaran-magan/scripts/repair_sync_translation_batch_021_040.py
      - name: Synchronize English checkpoint
        run: |
          python works/vandikkaran-magan/scripts/sync_translation_batch_021_040.py
      - name: Check repository diff
        run: |
          git diff --check
      - name: Commit synchronized checkpoint
        run: |
          rm -f .github/workflows/vm-translation-sync-021-040-once.yml
          rm -f works/vandikkaran-magan/scripts/repair_sync_translation_batch_021_040.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Synchronize Vandikkaran Magan English scenes 21-40 [skip ci]'
          git push origin main
