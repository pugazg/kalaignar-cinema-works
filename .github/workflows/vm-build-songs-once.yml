name: Vandikkaran Magan song performance build once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/vm-build-songs-once.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair QA assertion and build layer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('works/vandikkaran-magan/scripts/build_song_performance_index.py')
          s = p.read_text(encoding='utf-8')
          bad = "assert all(qa['checks'].values()) except qa['checks']['film_level_vali_credit_promoted_to_item_level'] is False"
          good = "positive_checks = ['character_gate_complete_verified','all_expanded_cue_preflight_pages_reviewed','source_order_record_ids_unique','every_record_has_scene_and_page_provenance','bounded_body_records_have_page_segments','cue_only_records_do_not_manufacture_lyrics']\nnegative_checks = ['film_level_vali_credit_promoted_to_item_level','canonical_tamil_changed','scene_text_changed','dialogue_records_changed','character_entity_mappings_changed']\nassert all(qa['checks'][k] for k in positive_checks)\nassert not any(qa['checks'][k] for k in negative_checks)"
          assert bad in s
          p.write_text(s.replace(bad, good), encoding='utf-8')
          PY
          python works/vandikkaran-magan/scripts/build_song_performance_index.py
      - name: Commit source-only performance layer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/vm-build-songs-once.yml
          git add -A
          git commit -m 'Build Vandikkaran Magan verified song performance layer [skip ci]'
          git push
