name: Raja Rani Reading Room payload QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "works/raja-rani/editions/en/reader-edition.json"
      - "works/raja-rani/editions/en/manifest.json"
      - "works/raja-rani/integrations/reading-room/build.py"
      - ".github/workflows/raja-rani-reading-room-payload.yml"

permissions:
  contents: write

jobs:
  build-reading-room-payload:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and validate Reading Room payload
        run: python works/raja-rani/integrations/reading-room/build.py

      - name: Commit generated integration payload
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            works/raja-rani/integrations/reading-room/reading-room.json \
            works/raja-rani/integrations/reading-room/QA_REPORT.md \
            works/raja-rani/integrations/reading-room/manifest.json
          if git diff --cached --quiet; then
            echo "Reading Room payload is already reproducible; nothing to commit."
          else
            git commit -m "Build Raja Rani Reading Room payload [skip ci]"
            git push
          fi
