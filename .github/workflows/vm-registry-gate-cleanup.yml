name: Reconcile Vandikkaran Magan registry gates
on:
  push:
    branches: [main]
    paths: ['.github/workflows/vm-registry-gate-cleanup.yml']
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python works/vandikkaran-magan/scripts/close_character_gate_registry_once.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/vm-registry-gate-cleanup.yml
          rm works/vandikkaran-magan/scripts/close_character_gate_registry_once.py
          git add -A
          git commit -m 'Align Vandikkaran Magan downstream gates [skip ci]'
          git push
